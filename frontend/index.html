                <strong>{{ step.title }}</strong>
                <small>{{ step.desc }}</small>
                <em><i :style="{ width: step.progress + '%' }"></i></em>
              </div>
            </div>
          </section>
        </section>

        <!-- 2. 知识库 -->
        <section v-show="tab === 'knowledge'" class="tab-panel document-room">
          <div class="section-head feature-page-head">
            <div class="feature-head-copy">
              <span class="feature-head-eyebrow">知识资产</span>
              <h2>知识库</h2>
              <p>查看知识是否有效、由谁负责，以及何时需要复审</p>
            </div>
            <div class="feature-head-tools">
              <div class="feature-head-metrics knowledge-head-metrics" aria-label="知识资产生命周期概况">
                <button v-for="metric in knowledgeActionMetrics" :key="metric.key" type="button"
                        :class="['feature-head-metric', 'knowledge-action-metric', { active: knowledgeStatusFilter === metric.key, attention: metric.key !== 'active' && metric.value }]"
                        @click="setKnowledgeStatusFilter(metric.key)" :aria-pressed="knowledgeStatusFilter === metric.key">
                  <small>{{ metric.label }}</small><strong>{{ metric.value }}</strong><em>{{ metric.hint }}</em>
                </button>
              </div>
              <div class="section-actions">
                <button v-if="can('knowledge.manage')" class="btn-secondary" @click="showCatModal = true; loadCategories()">分类管理</button>
                <button v-if="can('knowledge.upload')" class="btn-primary" @click="openUploadModal()">上传文档</button>
              </div>
            </div>
          </div>

          <div class="doc-layout">
            <section v-if="can('knowledge.upload')" class="upload-dropzone" @click="openUploadModal()">
              <span>上传</span>
              <div>
                <h3>拖拽或选择文档上传</h3>
                <p>支持 PDF / 图片 / TXT / MD / DOCX / CSV / JSON，扫描件会在后台 OCR，上传后自动切分知识块并进入 RAG 检索。</p>
              </div>
              <button class="btn-primary">选择文件</button>
            </section>

            <aside class="quality-panel">
              <h3>资产概况</h3>
              <div class="quality-row"><span>可见资产</span><strong>{{ knowledgeAssets.length }}</strong></div>
              <div class="quality-row"><span>文档分类</span><strong>{{ categories.length || 4 }}</strong></div>
              <div class="quality-row"><span>知识块</span><strong>{{ displayChunkCount }}</strong></div>
              <div class="quality-row"><span>当前筛选</span><strong>{{ filteredKnowledgeAssets.length }}</strong></div>
            </aside>
          </div>

          <section v-if="lastIngestion" class="ingestion-result" :class="{ 'graph-imported': lastIngestion.graphImported && !lastIngestion.syncWarning, 'sync-warning': lastIngestion.syncWarning }">
            <div>
              <span>{{ lastIngestion.syncWarning ? '入库成功，派生同步待修复' : lastIngestion.graphImported ? '图谱已更新' : '入库完成' }}</span>
              <strong>{{ lastIngestion.filename }}</strong>
              <p>
                已生成 {{ lastIngestion.chunks }} 个知识块
                <template v-if="lastIngestion.categories.length">，归入 {{ lastIngestion.categories.map(categoryLabel).join('、') }}</template>
                <template v-if="lastIngestion.graphImported">，并导入 {{ lastIngestion.graphNodes }} 个节点 / {{ lastIngestion.graphEdges }} 条关系</template>。
                <template v-if="lastIngestion.syncWarning"> 待修复：{{ lastIngestion.syncWarnings.join('、') }}。</template>
              </p>
            </div>
            <button v-if="lastIngestion.graphImported || lastIngestion.syncWarning" class="btn-secondary" @click="navigateTo(lastIngestion.syncWarning ? 'knowledge' : 'graph')">{{ lastIngestion.syncWarning ? '查看同步状态' : '查看图谱' }}</button>
            <button v-else class="btn-secondary" @click="lastIngestion = null">收起</button>
          </section>

          <div class="category-tabs" aria-label="按分类筛选">
            <button :class="{ active: !knowledgeCategoryFilter }" @click="knowledgeCategoryFilter = ''">全部</button>
            <button v-for="cat in categories.slice(0, 7)" :key="cat" :class="{ active: knowledgeCategoryFilter === cat }" @click="knowledgeCategoryFilter = cat">{{ categoryLabel(cat) }}</button>
          </div>

          <div class="knowledge-list-toolbar">
            <label class="knowledge-search-field">
              <span class="sr-only">搜索知识资产</span>
              <input v-model.trim="knowledgeSearch" type="search" placeholder="搜索资产、来源或责任人" />
            </label>
            <label class="knowledge-filter-field">
              <span class="sr-only">按状态筛选</span>
              <select v-model="knowledgeStatusFilter">
                <option v-for="option in knowledgeStatusOptions" :key="option.value" :value="option.value">{{ option.label }}</option>
                <option value="failed">处理失败</option>
              </select>
            </label>
            <span class="knowledge-result-count">{{ filteredKnowledgeAssets.length }} 条</span>
            <button v-if="knowledgeSearch || knowledgeStatusFilter || knowledgeCategoryFilter" class="btn-text" @click="knowledgeSearch = ''; knowledgeStatusFilter = ''; knowledgeCategoryFilter = ''">清除筛选</button>
          </div>

          <div v-if="knowledgeAssetsAccessDenied" class="knowledge-state-panel denied" role="status">
            <strong>无权查看知识资产</strong>
            <p>当前账号没有该项目知识库的访问权限。如需使用，请联系项目管理员调整成员关系或来源授权。</p>
          </div>
          <div v-else-if="knowledgeAssetsError" class="knowledge-state-panel error" role="alert">
            <strong>知识资产加载失败</strong>
            <p>{{ knowledgeAssetsError }}</p>
            <button class="btn-secondary" @click="loadKnowledgeAssets">重新加载</button>
          </div>
          <div v-else-if="knowledgeAssetsLoading" class="kb-cat-section knowledge-loading" aria-live="polite" aria-busy="true">
            <div class="knowledge-skeleton-row" v-for="idx in 5" :key="idx"><span></span><span></span><span></span><span></span></div>
          </div>
          <div class="kb-docs" v-else-if="filteredKnowledgeAssets.length">
            <div class="kb-cat-section knowledge-assets-section">
              <div class="kb-cat-title">
                <span>知识资产</span>
                <span class="badge">{{ filteredKnowledgeAssets.length }} 条</span>
              </div>
              <div class="knowledge-table-wrap">
                <table class="doc-table knowledge-asset-table">
                  <thead>
                    <tr><th>知识资产</th><th>状态</th><th>责任人</th><th>版本与复审</th><th>权限</th><th>操作</th></tr>
                  </thead>
                  <tbody>
                    <tr v-for="asset in filteredKnowledgeAssets" :key="knowledgeAssetId(asset)">
                      <td class="knowledge-asset-main">
                        <button class="doc-name-link knowledge-title-button" @click="openKnowledgeAsset(asset)">{{ knowledgeAssetTitle(asset) }}</button>
                        <small>{{ knowledgeAssetSource(asset) }} · {{ knowledgeAssetCategoryLabel(asset) }}<template v-if="asset.chunks || asset.chunk_count"> · {{ asset.chunks || asset.chunk_count }} 块</template></small>
                      </td>
                      <td>
                        <span :class="['asset-status-badge', knowledgeStatusTone(asset)]">{{ knowledgeStatusLabel(asset) }}</span>
                        <small v-if="knowledgeProcessingStatus(asset) !== 'completed'" :class="['asset-processing-state', { failed: knowledgeProcessingStatus(asset) === 'failed' }]">{{ knowledgeProcessingStatus(asset) === 'failed' ? '投影需要修复' : '新版本处理中' }}</small>
                      </td>
                      <td><span class="knowledge-owner"><i>{{ knowledgeOwnerName(asset).slice(0, 1) }}</i><span>{{ knowledgeOwnerName(asset) }}</span></span></td>
                      <td class="knowledge-version-cell"><strong>{{ knowledgeVersionLabel(asset) }}</strong><small :class="knowledgeReviewMeta(asset).tone">{{ knowledgeReviewMeta(asset).label }}</small></td>
                      <td class="knowledge-permission-cell"><strong>{{ knowledgeVisibilityLabel(asset) }}</strong><small>{{ knowledgeVisibilityDetail(asset) }}</small></td>
                      <td class="table-action-cell"><button class="btn-sm" @click="openKnowledgeAsset(asset)">{{ can('knowledge.manage') ? '详情与治理' : '预览' }}</button></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
          <div v-else-if="knowledgeAssets.length" class="knowledge-state-panel empty">
            <strong>没有符合条件的知识资产</strong>
            <p>尝试更换关键词、状态或分类筛选。</p>
            <button class="btn-secondary" @click="knowledgeSearch = ''; knowledgeStatusFilter = ''; knowledgeCategoryFilter = ''">清除筛选</button>
          </div>
          <div v-else class="knowledge-state-panel empty">
            <strong>知识库还是空的</strong>
            <p>{{ can('knowledge.upload') ? '上传项目说明、接口文档或交接资料，系统会创建可追溯的知识资产。' : '当前项目还没有可访问的知识资产。' }}</p>
            <button v-if="can('knowledge.upload')" class="btn-primary" @click="openUploadModal()">上传第一份文档</button>
          </div>
        </section>

        <!-- 3. 知识图谱 -->
        <section v-show="tab === 'graph'" class="tab-panel graph-room">
          <div class="section-head feature-page-head">
            <div class="feature-head-copy">
              <span class="feature-head-eyebrow">关系网络</span>
              <h2>知识图谱</h2>
              <p>混合语义关联与人工关系共存，支持 JSON 导入、拖拽编辑和实时保存</p>
            </div>
            <div class="feature-head-tools">
              <div class="feature-head-metrics" aria-label="知识图谱概况">
                <span class="feature-head-metric"><small>知识主题</small><strong>{{ displayGraphNodes }} 个节点</strong></span>
                <span class="feature-head-metric"><small>关系网络</small><strong>{{ displayGraphEdges }} 条关系</strong></span>
                <span :class="['feature-head-metric', graphSaving ? 'is-busy' : 'is-ok']"><small>编辑状态</small><strong>{{ graphSaving ? '保存中' : '实时保存' }}</strong></span>
              </div>
              <div class="section-actions">
                <button class="btn-secondary" @click="resetGraphView">重置视图</button>
                <button v-if="can('knowledge.manage')" class="btn-primary" @click="buildGraph" :disabled="graphBuilding">{{ graphBuilding ? '构建中' : '重新构建图谱' }}</button>
              </div>
            </div>
          </div>

          <div class="graph-page-grid">
            <section class="graph-canvas-card graph-workspace-card">
              <div class="graph-toolbar">
                <label class="graph-search-field">
                  <span class="graph-control-label">搜索</span>
                  <input type="text" v-model="graphSearch" class="graph-search" placeholder="节点、来源或标签" />
                  <button v-if="graphSearch" class="graph-search-clear" type="button" title="清除搜索" aria-label="清除搜索" @click="graphSearch = ''">×</button>
                </label>
                <div class="graph-toolbar-controls">
                  <div class="graph-control-group">
                    <span class="graph-control-label">范围</span>
                    <div class="graph-filter-chips" aria-label="图谱范围筛选">
                      <button v-for="group in graphGroups" :key="group" :class="{ active: graphGroupFilter === group }" @click="graphGroupFilter = group">{{ group }}</button>
                    </div>
                  </div>
                  <div class="graph-control-group graph-label-control">
                    <span class="graph-control-label">标签</span>
                    <div class="graph-label-switch" role="group" aria-label="图谱标签显示方式">
                      <button :class="{ active: graphLabelMode === 'smart' }" @click="graphLabelMode = 'smart'">关键</button>
                      <button :class="{ active: graphLabelMode === 'all' }" @click="graphLabelMode = 'all'">全部</button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="obsidian-graph-frame" :class="{ building: graphBuilding }">
                <div class="graph-engine-bar">
                  <span>{{ filteredGraph.nodes.length }} 节点 / {{ filteredGraph.edges.length }} 关系</span>
                  <span>缩放 {{ graphZoomLabel }}</span>
                  <span>混合关联</span>
                  <strong :class="{ saving: graphSaving }">{{ graphSaving ? '保存中' : '实时同步' }}</strong>
                </div>
                <div ref="graphCanvasRef" class="obsidian-graph-canvas"></div>
                <div class="graph-legend" aria-label="知识分组图例">
                  <span v-for="group in graphLegendGroups" :key="group.name" class="legend-key"><i :style="{ backgroundColor: group.color }"></i>{{ group.name }}</span>
                  <span class="legend-key relation-auto">虚线 自动关联</span>
                  <span class="legend-key relation-manual">实线 人工/导入</span>
                  <span class="legend-key muted">拖动固定</span>
                  <span class="legend-key muted">点击编辑</span>
                </div>
              </div>
            </section>

            <aside class="node-inspector graph-editor-panel">
              <h3>图谱编辑</h3>
              <div class="quality-row"><span>节点</span><strong>{{ displayGraphNodes }}</strong></div>
              <div class="quality-row"><span>关系</span><strong>{{ displayGraphEdges }}</strong></div>
              <div class="quality-row"><span>来源引用</span><strong>{{ displayCitationCount }}</strong></div>

              <div class="editor-switch">
                <button :class="{ active: graphEditorMode === 'node' }" @click="graphEditorMode = 'node'">节点</button>
                <button :class="{ active: graphEditorMode === 'edge' }" @click="graphEditorMode = 'edge'">关系</button>
              </div>

              <div v-if="graphEditorMode === 'node'" class="graph-editor-form">
                <div v-if="selectedGraphNode" class="selected-pill">正在编辑：{{ selectedGraphNode.topic || selectedGraphNode.label }}</div>
                <div v-else class="selected-pill muted">点击图中节点后可编辑</div>
                <div v-if="selectedGraphNode" class="node-source-reference">
                  <span>来源文档</span>
                  <strong>{{ selectedGraphNode.source || '手工创建节点' }}</strong>
                  <small v-if="selectedGraphNode.location">{{ selectedGraphNode.location }}</small>
                  <div v-if="selectedGraphNode.tags && selectedGraphNode.tags.length" class="node-tag-list">
                    <em v-for="tag in selectedGraphNode.tags" :key="tag">{{ tag }}</em>
                  </div>
                </div>
                <label>知识主题</label>
                <input class="form-input" v-model="nodeDraft.label" @input="applyNodeDraft" :disabled="!selectedGraphNode" />
                <label>分组</label>
                <input class="form-input" v-model="nodeDraft.group" @input="applyNodeDraft" :disabled="!selectedGraphNode" />
                <label>类型</label>
                <input class="form-input" v-model="nodeDraft.type" @input="applyNodeDraft" :disabled="!selectedGraphNode" />
                <label>说明</label>
                <textarea class="form-input" rows="3" v-model="nodeDraft.title" @input="applyNodeDraft" :disabled="!selectedGraphNode"></textarea>
                <label>节点权重</label>
                <input type="range" min="10" max="36" v-model="nodeDraft.size" @input="applyNodeDraft" :disabled="!selectedGraphNode" />
                <button v-if="can('knowledge.manage')" class="btn-danger-sm" @click="deleteGraphNode" :disabled="!selectedGraphNode">删除节点</button>

                <div class="graph-add-box">
                  <h4>新增节点</h4>
                  <input class="form-input" v-model="newNodeDraft.label" placeholder="知识主题，例如 算路超时提示" />
                  <input class="form-input" v-model="newNodeDraft.group" placeholder="分组，例如 架构/交接/风险" />
                  <input class="form-input" v-model="newNodeDraft.type" placeholder="类型，例如 文档节点" />
                  <button v-if="can('knowledge.manage')" class="btn-primary" @click="addGraphNode">新增节点</button>
                </div>
              </div>

              <div v-else class="graph-editor-form">
                <div v-if="selectedGraphEdge" class="selected-pill">正在编辑：{{ selectedGraphEdge.label }}</div>
                <div v-else class="selected-pill muted">点击图中连线后可编辑</div>
                <label>来源节点</label>
                <select class="form-input" v-model="edgeDraft.source" @change="selectedGraphEdge && applyEdgeDraft()">
                  <option v-for="node in graphData.nodes" :key="node.id" :value="node.id">{{ node.label }}</option>
                </select>
                <label>目标节点</label>
                <select class="form-input" v-model="edgeDraft.target" @change="selectedGraphEdge && applyEdgeDraft()">
                  <option v-for="node in graphData.nodes" :key="node.id" :value="node.id">{{ node.label }}</option>
                </select>
                <label>关系名称</label>
                <input class="form-input" list="graph-relation-types" v-model="edgeDraft.label" @input="selectedGraphEdge && applyEdgeDraft()" placeholder="依赖 / 引用 / 风险 / 交接" />
                <datalist id="graph-relation-types">
                  <option value="依赖"></option><option value="引用"></option><option value="依据"></option>
                  <option value="影响"></option><option value="风险"></option><option value="交接"></option><option value="验证"></option><option value="关联"></option>
                </datalist>
                <label>关系强度</label>
                <input type="range" min="1" max="6" v-model="edgeDraft.width" @input="selectedGraphEdge && applyEdgeDraft()" />
                <label>关联可信度 <span class="field-value">{{ Math.round(Number(edgeDraft.confidence || 0) * 100) }}%</span></label>
                <input type="range" min="0.2" max="1" step="0.05" v-model="edgeDraft.confidence" @input="selectedGraphEdge && applyEdgeDraft()" />
                <label>关联依据</label>
                <textarea class="form-input" rows="3" v-model="edgeDraft.evidence" @input="selectedGraphEdge && applyEdgeDraft()" placeholder="例如：共同标签、决策依据、人工确认说明"></textarea>
                <label class="graph-protected-toggle"><input type="checkbox" v-model="edgeDraft.protected" @change="selectedGraphEdge && applyEdgeDraft()" /> 重建后保留此关系</label>
                <p v-if="selectedGraphEdge" class="graph-relation-meta">{{ selectedGraphEdge.auto_generated ? '自动关联：编辑后将转为人工保护关系。' : `关系来源：${selectedGraphEdge.method === 'imported' ? '导入图谱' : '人工维护'}` }}</p>
                <div class="settings-actions">
                  <button v-if="can('knowledge.manage')" class="btn-primary" @click="addGraphEdge">新增关系</button>
                  <button v-if="can('knowledge.manage')" class="btn-danger-sm" @click="deleteGraphEdge" :disabled="!selectedGraphEdge">删除关系</button>
                </div>
              </div>

              <div v-if="graphMsg" class="settings-msg" :class="graphMsg.includes('失败') ? 'err' : 'ok'">{{ graphMsg }}</div>
            </aside>
          </div>

          <div v-if="graphData.nodes && graphData.nodes.length > 0" class="graph-table-section">
            <div class="graph-table-head"><h4>节点与关系列表</h4><span>列表展示当前筛选结果，使用搜索可定位全部内容</span></div>
            <table class="doc-table">
              <thead><tr><th>知识主题</th><th>来源文档</th><th>分组</th><th>类型</th><th>操作</th></tr></thead>
              <tbody>
                <tr v-for="node in graphTableNodes" :key="node.id">
                  <td>{{ node.topic || node.label || node.name }}</td>
                  <td>{{ node.source || '手工创建节点' }}</td>
                  <td>{{ node.group || '-' }}</td>
                  <td>{{ node.type || '-' }}</td>
                  <td class="table-action-cell"><div class="table-actions"><button class="btn-sm" @click="selectGraphNode(node)">定位编辑</button></div></td>
                </tr>
              </tbody>
            </table>
            <h4 style="margin-top:16px;">关系列表 <small v-if="filteredGraph.edges.length > graphTableEdges.length">（展示前 {{ graphTableEdges.length }} 条）</small></h4>
            <table class="doc-table">
              <thead><tr><th>来源</th><th>关系</th><th>目标</th><th>可信度</th><th>关联依据</th><th>操作</th></tr></thead>
              <tbody>
                <tr v-for="edge in graphTableEdges" :key="edge.id || edge.source + edge.target" @click="selectGraphEdge(edge)">
                  <td>{{ (graphData.nodes.find(n => n.id === (edge.source || edge.from)) || {}).label || edge.source }}</td>
                  <td>{{ edge.label || edge.relation }}</td>
                  <td>{{ (graphData.nodes.find(n => n.id === (edge.target || edge.to)) || {}).label || edge.target }}</td>
                  <td>{{ Math.round(Number(edge.confidence || 0) * 100) }}%</td>
                  <td>{{ edge.evidence || (edge.auto_generated ? '混合语义评分' : (edge.method === 'imported' ? 'JSON 导入关系' : '人工维护')) }}</td>
                  <td class="table-action-cell"><div class="table-actions"><button class="btn-sm" @click.stop="selectGraphEdge(edge)">编辑关系</button></div></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <!-- 4. 新人赋能 -->
        <section v-show="tab === 'onboarding'" class="tab-panel onboarding-room">
          <div class="section-head feature-page-head">
            <div class="feature-head-copy">
              <span class="feature-head-eyebrow">岗位学习</span>
              <h2>新人赋能</h2>
              <p>用岗位标准检查项目知识，再把授权资料转成个人可执行的上手计划</p>
            </div>
            <div class="feature-head-tools">
              <div v-if="can('onboarding.manage')" class="feature-head-metrics" aria-label="主管学习计划概况">
                <span class="feature-head-metric"><small>计划成员</small><strong>{{ supervisedOnboardingSummary.memberCount }} 人</strong></span>
                <span class="feature-head-metric"><small>进行中计划</small><strong>{{ supervisedOnboardingSummary.planCount }} 项</strong></span>
                <span :class="['feature-head-metric', supervisedOnboardingSummary.confirmationReadyCount ? 'is-warn' : 'is-ok']"><small>待负责人确认</small><strong>{{ supervisedOnboardingSummary.confirmationReadyCount }} 项</strong></span>
                <span :class="['feature-head-metric', supervisedOnboardingSummary.blockedPlanCount ? 'is-warn' : 'is-ok']"><small>资料待补充</small><strong>{{ supervisedOnboardingSummary.blockedPlanCount }} 项</strong></span>
              </div>
              <div v-else class="feature-head-metrics" aria-label="新人赋能概况">
                <span class="feature-head-metric"><small>目标成员</small><strong>{{ onboardingData?.target_user?.display_name || currentUser.display_name }}</strong></span>
                <span class="feature-head-metric"><small>目标岗位</small><strong>{{ onboardingRoleLabel }}</strong></span>
                <span class="feature-head-metric"><small>知识就绪度</small><strong>{{ onboardingData ? `${onboardingData.readiness}%` : '待分析' }}</strong></span>
                <span class="feature-head-metric"><small>个人进度</small><strong>{{ onboardingData?.plan ? `${onboardingData.plan.progress}%` : '未分配' }}</strong></span>
                <span :class="['feature-head-metric', onboardingData?.gaps?.length ? 'is-warn' : 'is-ok']"><small>待补知识</small><strong>{{ onboardingData?.gaps?.length || 0 }} 项</strong></span>
              </div>
              <div class="section-actions">
                <template v-if="!can('onboarding.manage') || onboardingPlanDetailOpen">
                  <select v-model="onboardingRole" class="form-select onboarding-role-select" aria-label="选择目标岗位" @change="loadOnboardingGuide({ openPlanDetail: can('onboarding.manage') })">
                    <option v-for="role in onboardingRoles" :key="role.value" :value="role.value">{{ role.label }}</option>
                  </select>
                  <select v-if="can('onboarding.manage')" v-model="onboardingTargetUserId" class="form-select onboarding-member-select" aria-label="选择目标成员" @change="loadOnboardingGuide({ openPlanDetail: true })">
                    <option v-for="member in onboardingTargetMembers" :key="member.user_id" :value="member.user_id">{{ member.display_name }} · {{ member.role_label }}</option>
                  </select>
                  <button class="btn-primary" @click="loadOnboardingGuide({ openPlanDetail: can('onboarding.manage') })" :disabled="onboardingLoading">{{ onboardingLoading ? '分析中' : '重新计算' }}</button>
                </template>
                <button v-if="can('onboarding.manage') && !onboardingPlanDetailOpen" class="btn-primary" @click="openOnboardingPlanAssignment">分配学习计划</button>
                <button v-if="can('onboarding.manage') && onboardingPlanDetailOpen" class="btn-secondary" @click="closeOnboardingPlanDetail">返回计划列表</button>
                <button v-if="can('onboarding.manage')" class="btn-secondary" @click="openOnboardingTemplateEditor">维护岗位模板</button>
                <button v-if="onboardingData?.gaps?.length && can('task.read')" class="btn-secondary" @click="createOnboardingGapTasks">生成补充任务</button>
              </div>
            </div>
          </div>

          <p v-if="onboardingTaskMessage" class="onboarding-task-message" role="status">{{ onboardingTaskMessage }}</p>

          <section v-if="can('onboarding.manage')" class="tool-card supervised-onboarding-panel" aria-label="主管学习计划列表">
            <div class="onboarding-section-head supervised-onboarding-head">
              <div><span>主管工作台</span><h3>进行中学习计划</h3></div>
              <small>仅显示由你分配并负责确认的计划；点击成员查看完整学习任务与证据。</small>
            </div>
            <div v-if="supervisedOnboardingPlansLoading" class="supervised-onboarding-state">正在加载成员学习计划…</div>
            <div v-else-if="supervisedOnboardingPlansError" class="supervised-onboarding-state error"><span>{{ supervisedOnboardingPlansError }}</span><button class="btn-secondary" @click="loadSupervisedOnboardingPlans">重新加载</button></div>
            <div v-else-if="!supervisedOnboardingPlans.length" class="supervised-onboarding-state"><strong>暂未分配进行中的学习计划</strong><span>分配后会在这里集中跟踪成员进度和负责人确认。</span><button class="btn-primary" @click="openOnboardingPlanAssignment">分配学习计划</button></div>
            <div v-else class="supervised-onboarding-list">
              <article v-for="plan in supervisedOnboardingPlans" :key="plan.plan_id" :class="['supervised-onboarding-row', { active: onboardingPlanDetailId === plan.plan_id, ready: plan.manager_confirmation?.can_confirm }]">
                <button type="button" class="supervised-onboarding-main" @click="openSupervisedOnboardingPlan(plan)">
                  <span class="supervised-onboarding-avatar">{{ (plan.user_name || '成').slice(0, 1) }}</span>
                  <span class="supervised-onboarding-member"><strong>{{ plan.user_name || '未命名成员' }}</strong><small>{{ plan.role_name || '未设置岗位' }} · {{ plan.user_email || '项目成员' }}</small></span>
                  <span class="supervised-onboarding-progress"><strong>{{ plan.progress }}%</strong><progress :value="plan.progress" max="100"></progress><small>个人上手进度</small></span>
                  <span class="supervised-onboarding-meta"><small>{{ plan.target_date ? `目标完成 ${plan.target_date}` : '未设置目标日期' }}</small><em v-if="plan.blocked_count">{{ plan.blocked_count }} 项待补资料</em><em v-else>查看计划</em></span>
                </button>
                <div class="supervised-onboarding-action">
                  <small>{{ plan.manager_confirmation?.hint }}</small>
                  <button v-if="plan.manager_confirmation?.status === 'completed'" class="btn-text" disabled>已负责人确认</button>
                  <button v-else class="btn-primary" :title="plan.manager_confirmation?.hint" :disabled="!plan.manager_confirmation?.can_confirm || Boolean(onboardingActionLoading)" @click.stop="confirmSupervisedOnboardingPlan(plan)">{{ onboardingActionLoading === `manager-confirmation:${plan.plan_id}` ? '确认中' : '负责人确认' }}</button>
                </div>
              </article>
            </div>
          </section>

          <div v-if="onboardingData && onboardingPlanDetailOpen" class="onboarding-layout">
            <section class="tool-card onboarding-readiness-panel">
              <div class="onboarding-section-head">
                <div><span>项目基础</span><h3>岗位知识就绪度</h3></div>
                <small>{{ onboardingData.formula }}</small>
              </div>
              <div class="onboarding-readiness-summary">
                <div class="onboarding-score" :style="{ '--readiness': `${onboardingData.readiness}%` }"><strong>{{ onboardingData.readiness }}%</strong><span>项目就绪度</span></div>
                <div class="onboarding-focus"><strong>{{ onboardingData.role }}上手重点</strong><p>{{ onboardingData.focus }}</p><small>仅统计当前成员有权访问且仍然有效的 {{ onboardingData.document_count }} 份知识资产。</small></div>
              </div>
              <div class="onboarding-dimension-list" aria-label="项目知识就绪度分项">
                <div v-for="(dimension, dimensionKey) in onboardingData.dimensions" :key="dimensionKey"><div><strong>{{ readinessDimensionLabel(dimensionKey) }}</strong><span>{{ dimension.score }}%</span></div><progress :value="dimension.score" max="100"></progress><small>贡献 {{ dimension.contribution }} 分</small></div>
              </div>
            </section>

            <section class="tool-card onboarding-plan-panel">
              <div class="onboarding-section-head">
                <div><span>个人执行</span><h3>上手学习计划</h3></div>
                <button v-if="!onboardingData.plan && can('onboarding.manage')" class="btn-primary" :disabled="onboardingActionLoading === 'create-plan'" @click="createOnboardingPlan">{{ onboardingActionLoading === 'create-plan' ? '创建中' : '分配计划' }}</button>
                <div v-else-if="onboardingData.plan" class="onboarding-plan-head-actions">
                  <button v-if="onboardingData.plan.status === 'active' && onboardingData.plan.blocked_count" class="btn-secondary" :disabled="Boolean(onboardingActionLoading)" @click="refreshOnboardingPlanMaterials">{{ onboardingActionLoading === 'refresh-materials' ? '刷新中' : '刷新学习资料' }}</button>
                  <span :class="['status-badge', onboardingData.plan.status === 'completed' ? 'ok' : 'info']">{{ onboardingData.plan.status === 'completed' ? '已完成' : '进行中' }}</span>
                </div>
              </div>
              <template v-if="onboardingData.plan">
                <div class="onboarding-plan-summary"><div><strong>{{ onboardingData.plan.progress }}%</strong><span>个人上手进度</span></div><p>{{ onboardingData.plan.formula }}<small>目标完成：{{ onboardingData.plan.target_date || '未设置' }}</small></p></div>
                <p v-if="onboardingData.plan.template_outdated" class="onboarding-plan-warning">岗位模板已更新；当前计划继续按创建时版本执行，避免中途改变成员任务。</p>
                <div class="onboarding-plan-dimensions"><div v-for="dimension in onboardingData.plan.dimensions" :key="dimension.key"><span>{{ dimension.label }}</span><strong>{{ dimension.score }}%</strong><small>{{ dimension.completed }} / {{ dimension.total }}</small></div></div>
                <div class="onboarding-item-list">
                  <article v-for="item in onboardingData.plan.items" :key="item.item_id" :class="['onboarding-item', item.status]">
                    <span class="onboarding-item-type">{{ onboardingItemTypeLabel(item.item_type) }}</span>
                    <div><strong>{{ item.title }}</strong><p>{{ item.description }}</p><small v-if="item.evidence">完成证据：{{ item.evidence }}</small></div>
                    <div class="onboarding-item-action">
                      <em>{{ onboardingItemStatusLabel(item.status) }}</em>
                      <small v-if="item.status === 'blocked'">等待权限范围内出现有效资料</small>
                      <input v-if="item.item_type === 'practice' && item.status !== 'completed'" v-model.trim="onboardingEvidenceDrafts[item.item_id]" class="form-input" placeholder="填写可核验的完成证据" />
                      <button v-if="item.status === 'completed'" class="btn-text" :disabled="onboardingActionLoading === item.item_id" @click="updateOnboardingItem(item, 'pending')">重新打开</button>
                      <button v-else-if="item.status !== 'blocked' && item.item_type !== 'manager_confirmation'" class="btn-secondary" :disabled="onboardingActionLoading === item.item_id" @click="updateOnboardingItem(item, 'completed')">标记完成</button>
                      <button v-else-if="item.status !== 'blocked' && item.item_type === 'manager_confirmation' && can('onboarding.manage')" class="btn-primary" :disabled="onboardingActionLoading === item.item_id" @click="updateOnboardingItem(item, 'completed')">负责人确认</button>
                    </div>
                  </article>
                </div>
              </template>
              <div v-else class="onboarding-plan-empty"><strong>尚未分配个人学习计划</strong><p>项目知识就绪度用于判断资料是否齐备；个人计划创建后，成员才能记录阅读、实践和负责人确认。</p></div>
            </section>

            <section class="tool-card onboarding-coverage-card">
              <div class="onboarding-section-head"><div><span>岗位标准</span><h3>知识主题覆盖</h3></div><small>{{ onboardingData.coverage.length }} 个必需主题</small></div>
              <div v-for="item in onboardingData.coverage" :key="item.category" class="coverage-row">
                <div><strong>{{ item.label }}</strong><small>{{ item.document_count }} 份资料 · 权威 {{ item.scores.authority }}% · 新鲜 {{ item.scores.freshness }}% · 可追溯 {{ item.scores.traceability }}%</small><p>{{ item.practice_task }}</p></div>
                <span :class="item.status === '已覆盖' ? 'status-badge ok' : 'status-badge no'">{{ item.status }}</span>
              </div>
            </section>

            <section class="tool-card onboarding-docs-card">
              <div class="card-head"><h3>优先阅读资料</h3><button @click="navigateTo('knowledge')">查看知识库</button></div>
              <div v-if="onboardingData.recommended_documents.length" class="onboarding-doc-list">
                <div v-for="doc in onboardingData.recommended_documents" :key="doc.source_file + doc.category" class="onboarding-doc-row">
                  <span>{{ doc.category_label }}</span>
                  <strong>{{ doc.source_file }}</strong>
                  <small>{{ doc.reason }}</small>
                </div>
              </div>
              <p v-else class="onboarding-empty">当前岗位还没有可直接推荐的资料，请先补充知识库中的项目文档。</p>
            </section>
          </div>
          <div v-if="onboardingError && (!can('onboarding.manage') || onboardingPlanDetailOpen)" class="tool-result"><div class="resign-error"><h4>学习路径加载失败</h4><p>{{ onboardingError }}</p></div></div>
          <div v-else-if="onboardingLoading && (!can('onboarding.manage') || onboardingPlanDetailOpen)" class="tool-card onboarding-loading">正在分析项目资料与岗位知识覆盖。</div>
        </section>

        <!-- 5. 知识任务 -->
        <section v-show="tab === 'tasks'" class="tab-panel knowledge-task-room">
          <div class="section-head feature-page-head">
            <div class="feature-head-copy">
              <span class="feature-head-eyebrow">知识治理协作</span>
              <h2>知识任务</h2>
              <p>把知识缺口、复审和交接补充落实到负责人、证据与验收</p>
            </div>
            <div class="feature-head-tools">
              <div class="feature-head-metrics" aria-label="知识任务概况">
                <span :class="['feature-head-metric', knowledgeTaskSummary.overdue ? 'is-warn' : 'is-ok']"><small>已超期</small><strong>{{ knowledgeTaskSummary.overdue || 0 }} 项</strong></span>
                <span class="feature-head-metric"><small>处理中</small><strong>{{ knowledgeTaskSummary.in_progress || 0 }} 项</strong></span>
                <span :class="['feature-head-metric', knowledgeTaskSummary.pending_acceptance ? 'is-warn' : 'is-ok']"><small>待验收</small><strong>{{ knowledgeTaskSummary.pending_acceptance || 0 }} 项</strong></span>
              </div>
              <div class="section-head-actions">
                <button v-if="canManageKnowledgeTasks" class="btn-secondary" @click="openKnowledgeTaskPolicy">{{ knowledgeTaskPolicyStatus }}</button>
                <button class="btn-secondary" @click="loadKnowledgeTasks" :disabled="knowledgeTasksLoading">{{ knowledgeTasksLoading ? '刷新中' : '刷新' }}</button>
                <button class="btn-primary" @click="openKnowledgeTaskModal">新建任务</button>
              </div>
            </div>
          </div>

          <div class="knowledge-task-toolbar" aria-label="任务筛选">
            <label><span>状态</span><select v-model="knowledgeTaskStatusFilter" class="form-select">
              <option value="active">未结束任务</option><option value="">全部状态</option>
              <option v-for="(meta, value) in knowledgeTaskStatusMeta" :key="value" :value="value">{{ meta.label }}</option>
            </select></label>
            <label><span>类型</span><select v-model="knowledgeTaskTypeFilter" class="form-select">
              <option value="">全部类型</option><option v-for="(label, value) in knowledgeTaskTypeMeta" :key="value" :value="value">{{ label }}</option>
            </select></label>
            <label class="knowledge-task-search"><span>搜索</span><input v-model.trim="knowledgeTaskKeyword" class="form-input" placeholder="标题、说明或负责人" /></label>
            <small>当前显示 {{ filteredKnowledgeTasks.length }} 项</small>
          </div>

          <p v-if="knowledgeTaskMessage" class="knowledge-task-feedback" role="status">{{ knowledgeTaskMessage }}</p>

          <div class="knowledge-task-layout">
            <section class="knowledge-task-list" aria-label="知识任务列表">
              <div v-if="knowledgeTasksLoading" class="knowledge-task-state">正在加载知识任务…</div>
              <div v-else-if="knowledgeTasksError" class="knowledge-task-state error"><strong>任务暂时无法读取</strong><span>{{ knowledgeTasksError }}</span><button class="btn-secondary" @click="loadKnowledgeTasks">重试</button></div>
              <div v-else-if="!filteredKnowledgeTasks.length" class="knowledge-task-state"><strong>当前筛选下没有任务</strong><span>知识缺口会从新人赋能、资产复审和交接流程进入这里。</span></div>
              <button v-for="task in filteredKnowledgeTasks" :key="task.task_id" type="button"
                      :class="['knowledge-task-row', { active: selectedKnowledgeTask?.task_id === task.task_id, overdue: task.overdue }]"
                      @click="openKnowledgeTask(task)">
                <span class="knowledge-task-row-main">
                  <span class="knowledge-task-row-kicker"><b>{{ knowledgeTaskTypeLabel(task.task_type) }}</b><em :class="['task-priority', task.priority]">{{ knowledgeTaskPriorityLabel(task.priority) }}</em></span>
                  <strong>{{ task.title }}</strong>
                  <small>{{ task.assignee_name || '待分配' }} · {{ task.due_at ? formatKnowledgeDate(task.due_at) + ' 截止' : '未设置截止时间' }}</small>
                </span>
                <span :class="['task-status', knowledgeTaskStatusMeta[task.status]?.tone]">{{ knowledgeTaskStatusLabel(task.status) }}</span>
              </button>
            </section>

            <aside class="knowledge-task-detail" aria-label="任务详情">
              <div v-if="knowledgeTaskDetailLoading" class="knowledge-task-state">正在读取任务详情…</div>
              <template v-else-if="selectedKnowledgeTask">
                <header>
                  <div><span>{{ knowledgeTaskTypeLabel(selectedKnowledgeTask.task_type) }}</span><h3>{{ selectedKnowledgeTask.title }}</h3></div>
                  <span :class="['task-status', knowledgeTaskStatusMeta[selectedKnowledgeTask.status]?.tone]">{{ knowledgeTaskStatusLabel(selectedKnowledgeTask.status) }}</span>
                </header>
                <p class="knowledge-task-description">{{ selectedKnowledgeTask.description || '未填写任务说明' }}</p>
                <dl class="knowledge-task-facts">
                  <div><dt>负责人</dt><dd>{{ selectedKnowledgeTask.assignee_name || '待分配' }}</dd></div>
                  <div><dt>报告人</dt><dd>{{ selectedKnowledgeTask.reporter_name || '系统' }}</dd></div>
                  <div><dt>截止时间</dt><dd :class="{ danger: selectedKnowledgeTask.overdue }">{{ selectedKnowledgeTask.due_at ? formatKnowledgeDate(selectedKnowledgeTask.due_at, true) : '未设置' }}</dd></div>
                  <div><dt>重复发现</dt><dd>{{ selectedKnowledgeTask.occurrence_count || 1 }} 次</dd></div>
                </dl>

                <div v-if="canManageKnowledgeTasks && !['completed','cancelled'].includes(selectedKnowledgeTask.status)" class="knowledge-task-assignment">
                  <label>任务负责人<select v-model="knowledgeTaskAssignee" class="form-select"><option value="">请选择成员</option><option v-for="member in projectMembers" :key="member.user_id" :value="member.user_id">{{ member.display_name }} · {{ member.role_label }}</option></select></label>
                  <button class="btn-secondary" :disabled="!knowledgeTaskAssignee || !!knowledgeTaskActionLoading || !knowledgeTaskCan('assign')" @click="actOnKnowledgeTask('assign')">转派</button>
                </div>

                <div v-if="['in_progress','pending_acceptance'].includes(selectedKnowledgeTask.status)" class="knowledge-task-field">
                  <label>完成证据</label>
                  <textarea v-model="knowledgeTaskEvidence" class="form-input" rows="3" :readonly="selectedKnowledgeTask.status === 'pending_acceptance'" placeholder="填写文档、版本、链接或可验证结果"></textarea>
                  <div v-if="selectedKnowledgeTask.status === 'in_progress' && knowledgeTaskCan('submit')" class="knowledge-task-evidence-upload">
                    <button type="button" class="btn-secondary" :disabled="kbUploading || !!knowledgeTaskActionLoading" @click="openKnowledgeTaskUploadModal">上传任务资料</button>
                    <small>按知识库标准创建新知识，支持批量上传；受理后自动写入完成证据。</small>
                  </div>
                  <p v-if="knowledgeTaskEvidenceUploadMessage" :class="['knowledge-task-evidence-message', knowledgeTaskEvidenceUploadMessage.startsWith('失败') ? 'error' : 'success']">{{ knowledgeTaskEvidenceUploadMessage }}</p>
                </div>
                <label v-if="!['completed','cancelled'].includes(selectedKnowledgeTask.status)" class="knowledge-task-field">处理说明<textarea v-model="knowledgeTaskNote" class="form-input" rows="2" placeholder="备注、退回或取消原因"></textarea></label>

                <div class="knowledge-task-actions">
                  <button v-if="selectedKnowledgeTask.status === 'unassigned'" class="btn-primary" :disabled="!!knowledgeTaskActionLoading || !knowledgeTaskCan('claim')" @click="actOnKnowledgeTask('claim')">{{ knowledgeTaskActionLoading === 'claim' ? '领取中…' : '领取任务' }}</button>
                  <button v-if="selectedKnowledgeTask.status === 'open'" class="btn-primary" :disabled="!!knowledgeTaskActionLoading || !knowledgeTaskCan('start')" @click="actOnKnowledgeTask('start')">{{ knowledgeTaskActionLoading === 'start' ? '处理中…' : '开始处理' }}</button>
                  <button v-if="selectedKnowledgeTask.status === 'in_progress'" class="btn-primary" :disabled="!!knowledgeTaskActionLoading || kbUploading || !knowledgeTaskCan('submit')" @click="actOnKnowledgeTask('submit')">{{ knowledgeTaskActionLoading === 'submit' ? '提交中…' : '提交验收' }}</button>
                  <button v-if="selectedKnowledgeTask.status === 'pending_acceptance' && knowledgeTaskCan('accept')" class="btn-primary" :disabled="!!knowledgeTaskActionLoading" @click="actOnKnowledgeTask('accept')">{{ knowledgeTaskActionLoading === 'accept' ? '验收中…' : '验收通过' }}</button>
                  <button v-if="selectedKnowledgeTask.status === 'pending_acceptance' && knowledgeTaskCan('return')" class="btn-secondary" :disabled="!!knowledgeTaskActionLoading" @click="actOnKnowledgeTask('return')">退回补充</button>
                  <button v-if="knowledgeTaskCan('cancel')" type="button" class="btn-danger-sm knowledge-task-cancel" :disabled="!!knowledgeTaskActionLoading" @click="openKnowledgeTaskCancel">取消任务</button>
                </div>
                <p v-if="selectedKnowledgeTask.primary_action_block_reason" class="knowledge-task-action-hint">{{ selectedKnowledgeTask.primary_action_block_reason }}</p>

                <section v-if="selectedKnowledgeTask.writeback" :class="['knowledge-task-writeback', { skipped: !selectedKnowledgeTask.writeback.applied }]" aria-label="任务联动结果">
                  <div><strong>{{ knowledgeTaskWritebackTitle(selectedKnowledgeTask.writeback) }}</strong><span>{{ knowledgeTaskWritebackStatus(selectedKnowledgeTask.writeback) }}</span></div>
                  <p>{{ selectedKnowledgeTask.writeback.message }}</p>
                  <button v-if="selectedKnowledgeTask.writeback.processing_job_id && can('job.read')" class="btn-secondary" @click="openKnowledgeTaskProcessingJob(selectedKnowledgeTask.writeback)">查看刷新任务</button>
                </section>

                <section class="knowledge-task-notify">
                  <div><strong>飞书提醒</strong><small>发送失败不会改变任务状态</small></div>
                  <input v-model.trim="knowledgeTaskChatId" class="form-input" :placeholder="feishuDefaultChatId || '输入飞书 Chat ID'" />
                  <button class="btn-secondary" :disabled="knowledgeTaskActionLoading" @click="notifyKnowledgeTask">发送提醒</button>
                </section>

                <section v-if="selectedKnowledgeTask.notifications?.length" class="knowledge-task-history knowledge-task-notification-history">
                  <h4>提醒记录</h4>
                  <ol>
                    <li v-for="notification in selectedKnowledgeTask.notifications" :key="notification.notification_id">
                      <span>{{ knowledgeTaskNotificationKindLabel(notification.notification_kind) }}<template v-if="notification.escalation_level"> L{{ notification.escalation_level }}</template></span>
                      <strong>{{ knowledgeTaskNotificationStatusLabel(notification) }}</strong>
                      <small>{{ formatKnowledgeDate(notification.attempted_at || notification.scheduled_at || notification.created_at, true) }}<template v-if="notification.attempt_count"> · {{ notification.attempt_count }} 次尝试</template><template v-if="notification.error"> · {{ notification.error }}</template></small>
                      <button v-if="notification.processing_job_id && canManageProcessingJobs" class="btn-text" @click="openKnowledgeTaskProcessingJob(notification)">查看处理任务</button>
                    </li>
                  </ol>
                </section>

                <section class="knowledge-task-history">
                  <h4>处理记录</h4>
                  <ol v-if="selectedKnowledgeTask.events?.length">
                    <li v-for="event in [...selectedKnowledgeTask.events].reverse()" :key="event.event_id"><span>{{ knowledgeTaskEventLabel(event.event_type) }}</span><strong>{{ knowledgeTaskStatusLabel(event.to_status) }}</strong><small>{{ formatKnowledgeDate(event.created_at, true) }}<template v-if="event.note"> · {{ event.note }}</template></small></li>
                  </ol>
                  <p v-else>暂无处理记录</p>
                </section>
              </template>
              <div v-else class="knowledge-task-state"><strong>选择一项任务查看详情</strong><span>详情区将展示负责人、证据、验收动作和完整记录。</span></div>
            </aside>
          </div>
        </section>

        <section v-show="tab === 'jobs'" class="tab-panel processing-job-room">
          <div class="section-head feature-page-head">
            <div class="feature-head-copy">
              <span class="feature-head-eyebrow">系统执行与恢复</span>
              <h2>处理任务</h2>
              <p>跟踪文档、图片识别、图谱和飞书同步的实际进度，失败任务可审查并恢复</p>
            </div>
            <div class="feature-head-tools">
              <div class="feature-head-metrics" aria-label="处理任务概况">
                <span :class="['feature-head-metric', processingJobSummary.active ? 'is-warn' : 'is-ok']"><small>进行中</small><strong>{{ processingJobSummary.active || 0 }} 项</strong></span>
                <span :class="['feature-head-metric', processingJobSummary.retry_wait ? 'is-warn' : 'is-ok']"><small>等待重试</small><strong>{{ processingJobSummary.retry_wait || 0 }} 项</strong></span>
                <span :class="['feature-head-metric', processingJobSummary.failed ? 'is-warn' : 'is-ok']"><small>失败</small><strong>{{ processingJobSummary.failed || 0 }} 项</strong></span>
              </div>
              <button class="btn-secondary" @click="loadProcessingJobs" :disabled="processingJobsLoading">{{ processingJobsLoading ? '刷新中' : '刷新状态' }}</button>
            </div>
          </div>

          <div class="processing-job-toolbar" aria-label="处理任务筛选">
            <label><span>状态</span><select v-model="processingJobStatusFilter" class="form-select" @change="processingJobPage = 1; loadProcessingJobs({ keepSelection: false })">
              <option value="active">正在处理</option><option value="">全部状态</option>
              <option v-for="(meta, value) in processingJobStatusMeta" :key="value" :value="value">{{ meta.label }}</option>
            </select></label>
            <label><span>类型</span><select v-model="processingJobTypeFilter" class="form-select" @change="processingJobPage = 1; loadProcessingJobs({ keepSelection: false })">
              <option value="">全部类型</option><option v-for="(label, value) in processingJobTypeMeta" :key="value" :value="value">{{ label }}</option>
            </select></label>
            <label class="processing-job-search"><span>搜索</span><input v-model.trim="processingJobKeyword" class="form-input" placeholder="文档名称、任务类型或任务 ID" @keyup.enter="processingJobPage = 1; loadProcessingJobs({ keepSelection: false })" /></label>
            <button class="btn-secondary" @click="processingJobPage = 1; loadProcessingJobs({ keepSelection: false })">查询</button>
          </div>

          <p v-if="processingJobMessage" class="knowledge-task-feedback" role="status">{{ processingJobMessage }}</p>

          <div class="processing-job-layout">
            <section class="processing-job-list" aria-label="处理任务列表">
              <div v-if="processingJobsLoading" class="knowledge-task-state">正在读取处理任务…</div>
              <div v-else-if="processingJobsError" class="knowledge-task-state error"><strong>处理任务暂时无法读取</strong><span>{{ processingJobsError }}</span><button class="btn-secondary" @click="loadProcessingJobs">重试</button></div>
              <div v-else-if="!processingJobs.length" class="knowledge-task-state"><strong>当前筛选下没有任务</strong><span>文档入库、图片识别、图谱重建、知识投影修复和飞书同步会出现在这里。</span></div>
              <button v-for="job in processingJobs" :key="job.job_id" type="button" :class="['processing-job-row', { active: selectedProcessingJob?.job_id === job.job_id }]" @click="openProcessingJob(job)">
                <span class="processing-job-row-main">
                  <span><b>{{ processingJobTypeLabel(job.job_type) }}</b><em>{{ processingJobStageLabel(job.stage) }}</em></span>
                  <strong>{{ processingJobDisplayName(job) }}</strong>
                  <small>第 {{ job.attempts || 0 }}/{{ job.max_attempts }} 次 · {{ formatKnowledgeDate(job.updated_at, true) }}</small>
                  <span class="processing-job-progress"><i :style="{ width: `${job.progress || 0}%` }"></i></span>
                </span>
                <span :class="['task-status', processingJobStatusMeta[job.status]?.tone]">{{ processingJobStatusLabel(job.status) }}</span>
              </button>
              <footer v-if="processingJobPages > 1" class="processing-job-pagination">
                <button class="btn-secondary" :disabled="processingJobPage <= 1" @click="changeProcessingJobPage(-1)">上一页</button>
                <span>第 {{ processingJobPage }} / {{ processingJobPages }} 页，共 {{ processingJobTotal }} 项</span>
                <button class="btn-secondary" :disabled="processingJobPage >= processingJobPages" @click="changeProcessingJobPage(1)">下一页</button>
              </footer>
            </section>

            <aside class="processing-job-detail" aria-label="处理任务详情">
              <div v-if="processingJobDetailLoading" class="knowledge-task-state">正在读取任务详情…</div>
              <template v-else-if="selectedProcessingJob">
                <header><div><span>{{ processingJobTypeLabel(selectedProcessingJob.job_type) }} · {{ processingJobStageLabel(selectedProcessingJob.stage) }}</span><h3>{{ processingJobDisplayName(selectedProcessingJob) }}</h3></div><span :class="['task-status', processingJobStatusMeta[selectedProcessingJob.status]?.tone]">{{ processingJobStatusLabel(selectedProcessingJob.status) }}</span></header>
                <div class="processing-job-current">
                  <div><strong>{{ selectedProcessingJob.progress || 0 }}%</strong><span>{{ selectedProcessingJob.status === 'retry_wait' ? `下次尝试：${formatKnowledgeDate(selectedProcessingJob.available_at, true)}` : processingJobStageLabel(selectedProcessingJob.stage) }}</span></div>
                  <span class="processing-job-progress"><i :style="{ width: `${selectedProcessingJob.progress || 0}%` }"></i></span>
                </div>
                <dl class="knowledge-task-facts">
                  <div><dt>任务 ID</dt><dd>{{ selectedProcessingJob.job_id }}</dd></div>
                  <div><dt>发起人</dt><dd>{{ selectedProcessingJob.created_by || '系统' }}</dd></div>
                  <div><dt>尝试次数</dt><dd>{{ selectedProcessingJob.attempts || 0 }} / {{ selectedProcessingJob.max_attempts }}</dd></div>
                  <div><dt>来源</dt><dd>{{ selectedProcessingJob.source_id || selectedProcessingJob.linked_asset_id || '系统操作' }}</dd></div>
                </dl>
                <div v-if="selectedProcessingJob.last_error" class="processing-job-error"><strong>{{ selectedProcessingJob.error_code || '处理失败' }}</strong><p>{{ selectedProcessingJob.last_error }}</p></div>
                <section v-if="selectedProcessingJob.job_type === 'feishu_candidate_batch' && selectedProcessingJob.result?.total" class="processing-job-attempts">
                  <h4>逐项处理结果</h4>
                  <p>已处理 {{ selectedProcessingJob.result.processed || 0 }} / {{ selectedProcessingJob.result.total }} 项，成功 {{ selectedProcessingJob.result.succeeded_count || 0 }} 项，失败 {{ selectedProcessingJob.result.failed_count || 0 }} 项</p>
                  <ol v-if="selectedProcessingJob.result.items?.length"><li v-for="item in selectedProcessingJob.result.items" :key="item.candidate_id"><b>{{ item.candidate_id }}</b><span>{{ item.status === 'succeeded' ? '处理成功' : '处理失败' }}</span><small v-if="item.error">{{ item.error }}</small></li></ol>
                </section>
                <section v-if="selectedProcessingJob.job_type === 'feishu_message_enrichment' && selectedProcessingJob.result?.message_id" class="processing-job-attempts">
                  <h4>图片识别结果</h4>
                  <ol><li><b>{{ selectedProcessingJob.result.message_id }}</b><span>{{ selectedProcessingJob.result.extraction_status === 'completed' ? '识别完成' : selectedProcessingJob.result.extraction_status === 'partial' ? '部分完成' : '识别未完成' }}</span><small>{{ selectedProcessingJob.result.extraction_method || '未产生识别方法' }} · {{ selectedProcessingJob.result.resource_count || 0 }} 个资源<template v-if="selectedProcessingJob.result.published"> · 自动入库 {{ selectedProcessingJob.result.published }} 项</template></small></li></ol>
                </section>
                <section v-if="selectedProcessingJob.job_type === 'document_ingestion' && selectedProcessingJob.result?.extraction_status" class="processing-job-attempts">
                  <h4>文档提取结果</h4>
                  <ol><li><b>{{ selectedProcessingJob.result.filename || selectedProcessingJob.source_id }}</b><span>{{ selectedProcessingJob.result.extraction_status === 'partial' ? '部分识别' : selectedProcessingJob.result.extraction_status === 'completed' ? 'OCR 完成' : '原生文本' }}</span><small>{{ selectedProcessingJob.result.extraction_method || 'native_text' }} · {{ selectedProcessingJob.result.ocr_page_count || 0 }} / {{ selectedProcessingJob.result.page_count || 0 }} 页 OCR<template v-if="selectedProcessingJob.result.extraction_warning"> · {{ selectedProcessingJob.result.extraction_warning }}</template></small></li></ol>
                </section>
                <div class="knowledge-task-actions">
                  <button v-if="['queued','running','retry_wait'].includes(selectedProcessingJob.status)" class="btn-secondary" :disabled="processingJobActionLoading" @click="actOnProcessingJob('cancel')">{{ selectedProcessingJob.status === 'running' ? '请求停止' : '取消任务' }}</button>
                  <button v-if="canRetrySelectedProcessingJob" class="btn-primary" :disabled="processingJobActionLoading === 'retry'" @click="actOnProcessingJob('retry')">{{ processingJobActionLoading === 'retry' ? '正在重新加入队列…' : '重新执行' }}</button>
                </div>
                <section class="processing-job-attempts">
                  <h4>执行尝试</h4>
                  <ol v-if="selectedProcessingJob.attempt_history?.length"><li v-for="attempt in selectedProcessingJob.attempt_history" :key="attempt.attempt_id"><b>#{{ attempt.attempt_number }}</b><span>{{ processingJobStatusLabel(attempt.status) }}</span><small>{{ formatKnowledgeDate(attempt.started_at, true) }}<template v-if="attempt.error_message"> · {{ attempt.error_message }}</template></small></li></ol>
                  <p v-else>尚未开始执行</p>
                </section>
                <section class="processing-job-attempts">
                  <h4>状态记录</h4>
                  <ol v-if="selectedProcessingJob.events?.length"><li v-for="event in [...selectedProcessingJob.events].reverse().slice(0, 20)" :key="event.event_id"><b>{{ processingJobStageLabel(event.stage) }}</b><span>{{ event.message || processingJobStatusLabel(event.to_status) }}</span><small>{{ formatKnowledgeDate(event.created_at, true) }}</small></li></ol>
                </section>
              </template>
              <div v-else class="knowledge-task-state"><strong>选择一项任务查看详情</strong><span>详情区展示当前阶段、失败原因、尝试记录和恢复动作。</span></div>
            </aside>
          </div>
        </section>

        <!-- 6. 飞书集成 -->
        <section v-show="tab === 'feishu'" class="tab-panel feishu-room">
          <div class="section-head feature-page-head">
            <div class="feature-head-copy">
              <span class="feature-head-eyebrow">协作沉淀</span>
              <h2>飞书知识自动化</h2>
              <p>授权项目群消息自动归档、聚合和沉淀，日常无需逐条确认</p>
            </div>
            <div class="feature-head-tools">
              <div class="feature-head-metrics" aria-label="飞书自动化概况">
                <span :class="['feature-head-metric', feishuEventConnected ? 'is-ok' : 'is-warn']"><small>事件通道</small><strong>{{ feishuEventConnected ? '已连接' : '待连接' }}</strong></span>
                <span class="feature-head-metric"><small>今日接收</small><strong>{{ feishuSummary.today_received || 0 }} 条</strong></span>
                <span :class="['feature-head-metric', feishuSummary.review_required_count ? 'is-warn' : 'is-ok']"><small>需处理</small><strong>{{ feishuSummary.review_required_count || 0 }} 项</strong></span>
              </div>
              <div class="section-head-actions">
                <button class="btn-secondary" @click="loadFeishuWorkspace" :disabled="feishuWorkspaceLoading">{{ feishuWorkspaceLoading ? '刷新中' : '刷新状态' }}</button>
                <button class="btn-primary" @click="pushDaily" :disabled="feishuLoading">{{ feishuLoading ? '推送中' : '推送知识卡片' }}</button>
              </div>
            </div>
          </div>

          <div class="feishu-console-shell">
            <nav class="feishu-console-nav" role="tablist" aria-label="飞书知识自动化工作台">
              <button role="tab" :aria-selected="feishuView === 'overview'" :class="{ active: feishuView === 'overview' }" @click="feishuView = 'overview'"><span>总览</span><small>自动化状态</small></button>
              <button role="tab" :aria-selected="feishuView === 'sources'" :class="{ active: feishuView === 'sources' }" @click="feishuView = 'sources'"><span>采集源</span><small>{{ feishuSummary.group_count || 0 }} 个运行</small></button>
              <button role="tab" :aria-selected="feishuView === 'content'" :class="{ active: feishuView === 'content' }" @click="feishuView = 'content'"><span>内容中心</span><small>{{ feishuSummary.published_count || 0 }} 项知识</small></button>
              <button role="tab" :aria-selected="feishuView === 'exceptions'" :class="{ active: feishuView === 'exceptions' }" @click="feishuView = 'exceptions'"><span>需处理</span><small>{{ feishuSummary.review_required_count || 0 }} 项异常</small></button>
              <button role="tab" :aria-selected="feishuView === 'settings'" :class="{ active: feishuView === 'settings' }" @click="feishuView = 'settings'"><span>设置与审计</span><small>连接和记录</small></button>
            </nav>

            <div class="feishu-console-main" role="tabpanel" aria-live="polite">
              <template v-if="feishuView === 'overview'">
                <section class="feishu-connection-banner automation-status" :class="{ offline: !feishuEventConnected }">
                  <div>
                    <span class="eyebrow">飞书知识自动化</span>
                    <h3>{{ feishuEventConnected ? '自动化正常运行' : feishuConnection.configured ? '事件通道需要连接' : '等待配置飞书应用' }}</h3>
                    <p>授权群消息自动归档，系统聚合有价值内容，仅将异常交给人工处理。</p>
                  </div>
                  <div class="feishu-connection-actions">
                    <span :class="['connection-pill', feishuEventConnected ? 'ok' : 'warn']">{{ feishuTransportLabel() }}</span>
                    <button class="btn-secondary" @click="feishuEventConnected ? (feishuView = 'settings') : startFeishuEventConnection()" :disabled="feishuWorkspaceLoading || !feishuConnection.configured">{{ feishuEventConnected ? '查看连接' : '连接通道' }}</button>
                  </div>
                </section>

                <div class="feishu-metric-band">
                  <article><span>今日接收</span><strong>{{ feishuSummary.today_received || 0 }}</strong><small>授权源原始内容</small></article>
                  <article><span>有效内容</span><strong>{{ feishuSummary.today_valuable_count || 0 }}</strong><small>通过价值与安全判断</small></article>
                  <article><span>今日同批入库</span><strong>{{ feishuSummary.today_published_count || 0 }}</strong><small>由今日消息形成</small></article>
                  <article><span>今日完成发布</span><strong>{{ feishuSummary.today_completed_count || 0 }}</strong><small>含历史候选处理完成</small></article>
                  <article :class="{ attention: feishuSummary.review_required_count }"><span>需处理</span><strong>{{ feishuSummary.review_required_count || 0 }}</strong><small>敏感、低置信度或失败</small></article>
                </div>

                <section class="feishu-conversion-dashboard" aria-labelledby="feishu-conversion-title">
                  <div class="panel-heading">
                    <div><span>今日转化</span><h3 id="feishu-conversion-title">从消息接收到可复用知识</h3></div>
                    <div class="conversion-rate-badge"><strong>{{ feishuTodayConversion.conversionRate }}%</strong><span>消息转知识</span></div>
                  </div>
                  <div class="feishu-conversion-layout">
                    <ol class="feishu-conversion-flow">
                      <li v-for="(stage, index) in feishuTodayConversion.stages" :key="stage.key">
                        <span class="conversion-step-index">{{ index + 1 }}</span>
                        <div><strong>{{ stage.label }} <em>{{ stage.count }}</em></strong><small>{{ stage.detail }}</small><i><b :style="{ width: stage.width + '%' }"></b></i></div>
                      </li>
                    </ol>
                    <div class="feishu-conversion-insights">
                      <div class="conversion-insight-kpis">
                        <article><span>自动处理率</span><strong>{{ feishuTodayConversion.automationRate }}%</strong><small>今日消息无需人工介入</small></article>
                        <article><span>今日完成发布</span><strong>{{ feishuTodayConversion.completedCount }}</strong><small>包含历史候选处理完成</small></article>
                        <article><span>运行采集源</span><strong>{{ feishuSummary.group_count || 0 }}</strong><small>已授权项目群</small></article>
                      </div>
                      <div class="processing-composition">
                        <div class="mini-panel-head"><h4>累计处理构成</h4><span>{{ feishuSummary.message_count || 0 }} 条消息</span></div>
                        <div v-for="item in feishuProcessingComposition" :key="item.key" class="composition-row">
                          <span>{{ item.label }}</span><strong>{{ item.count }}</strong><i><b :class="item.tone" :style="{ width: item.width + '%' }"></b></i>
                        </div>
                      </div>
                    </div>
                  </div>
                  <ol class="feishu-total-pipeline" aria-label="累计知识转化漏斗">
                    <li v-for="(stage, index) in feishuPipelineStages" :key="stage.key">
                      <span>{{ index + 1 }}</span><div><strong>{{ stage.label }}</strong><small>{{ stage.count }} 项 · {{ stage.detail }}</small></div><i v-if="index < feishuPipelineStages.length - 1">›</i>
                    </li>
                  </ol>
                </section>

                <section class="feishu-overview-grid automation-overview">
                  <div class="feishu-runtime-summary">
                    <div class="panel-heading"><div><span>实时动态</span><h3>最近自动处理记录</h3></div><button class="text-action" @click="feishuView = 'content'">查看全部内容</button></div>
                    <div class="feishu-overview-activity">
                      <article v-for="activity in feishuRecentActivity" :key="activity.id">

                        <time>{{ activity.time }}</time>
                      </article>
                      <p v-if="!feishuRecentActivity.length" class="feishu-empty-inline">暂无飞书处理动态。</p>

                  </div>
                  <div class="feishu-exception-summary">
                    <span>当前状态</span>
                    <h3>{{ feishuPendingCandidates.length ? `${feishuPendingCandidates.length} 项需要人工处理` : '自动化运行正常' }}</h3>

                    <button :class="feishuPendingCandidates.length ? 'btn-primary' : 'btn-secondary'" @click="feishuPendingCandidates.length ? (feishuView = 'exceptions') : (feishuView = 'sources')">{{ feishuPendingCandidates.length ? '处理异常' : '查看采集规则' }}</button>
                  </div>
                </section>
              </template>

              <template v-else-if="feishuView === 'sources'">
                <section class="feishu-view-head">
                  <div><span class="eyebrow">采集源与规则</span><h3>选择授权群，并设置自动化边界</h3></div>
                  <div class="feishu-live-actions"><button class="btn-secondary" @click="discoverFeishuChats" :disabled="feishuDiscoveringChats">{{ feishuDiscoveringChats ? '读取中' : '刷新群列表' }}</button><button class="btn-secondary" @click="startFeishuGroupDraft">手动添加</button></div>
                </section>
                <div class="feishu-group-layout">
                  <div class="feishu-group-list">
                    <div class="feishu-group-list-head"><span>机器人所在群</span><strong>{{ feishuAvailableChats.length }}</strong></div>
                    <button v-for="chat in feishuAvailableChats" :key="chat.chat_id" :class="['feishu-group-row', { active: chat.chat_id === (feishuSelectedGroupId || feishuGroupDraft.chat_id) }]" @click="selectFeishuAvailableChat(chat)">
                      <span class="group-avatar"><img v-if="chat.avatar" :src="chat.avatar" alt="" referrerpolicy="no-referrer" /><template v-else>{{ (chat.name || '群').slice(0, 1) }}</template></span>
                      <span><strong>{{ chat.name }}</strong><small>{{ chat.connected ? `${feishuModeLabel(chat.collection_mode)}，已同步 ${chat.synced_count || 0} 条` : '可启用智能沉淀' }}</small></span>
                      <em :class="{ available: !chat.connected }">{{ chat.external ? '外部群' : chat.connected ? '已接入' : '可接入' }}</em>
                    </button>
                    <div v-if="feishuDiscoveringChats" class="feishu-empty-inline">正在读取机器人所在群聊...</div>
                    <div v-else-if="!feishuAvailableChats.length" class="feishu-empty-inline">暂未发现群聊。请先将机器人加入目标群，再刷新列表。</div>
                    <p v-if="feishuDiscoveryMsg" :class="['feishu-discovery-message', { err: feishuDiscoveryMsg.includes('失败') }]">{{ feishuDiscoveryMsg }}</p>
                  </div>
                  <form class="feishu-group-editor source-policy-editor" @submit.prevent="saveFeishuGroup">
                    <div class="panel-heading"><div><span>{{ feishuSelectedGroup ? '编辑采集源' : '新增采集源' }}</span><h3>{{ feishuGroupDraft.name || '群接入设置' }}</h3></div><span class="editor-hint">仅采集明确授权的群</span></div>
                    <div class="feishu-form-grid compact"><label class="form-group"><span>群聊名称</span><input v-model="feishuGroupDraft.name" class="form-input" placeholder="例如：导航项目研发群" required /></label><label class="form-group"><span>Chat ID</span><input v-model="feishuGroupDraft.chat_id" class="form-input" placeholder="oc_xxxxxxxxx" required /></label></div>
                    <fieldset class="feishu-mode-selector">
                      <legend>采集模式</legend>
                      <label :class="{ active: feishuGroupDraft.collection_mode === 'auto' }"><input type="radio" value="auto" v-model="feishuGroupDraft.collection_mode" /><span><strong>智能沉淀</strong><small>高置信度知识自动入库，只处理异常</small></span><em>推荐</em></label>
                      <label :class="{ active: feishuGroupDraft.collection_mode === 'review' }"><input type="radio" value="review" v-model="feishuGroupDraft.collection_mode" /><span><strong>谨慎沉淀</strong><small>有价值内容聚合后进入需处理</small></span></label>
                      <label :class="{ active: feishuGroupDraft.collection_mode === 'archive_only' }"><input type="radio" value="archive_only" v-model="feishuGroupDraft.collection_mode" /><span><strong>仅归档</strong><small>保留内容，不生成知识候选</small></span></label>
                      <label :class="{ active: feishuGroupDraft.collection_mode === 'off' }"><input type="radio" value="off" v-model="feishuGroupDraft.collection_mode" /><span><strong>关闭采集</strong><small>不保存消息，机器人问答可单独保留</small></span></label>
                    </fieldset>

                    <div v-if="record.risks.length" class="handover-risk-tags"><span v-for="risk in record.risks" :key="risk">{{ risk }}</span></div>

	                  </div>
	                  <span :class="['status-badge', record.status === 'completed' || record.learning_plan_status === 'ready' ? 'ok' : 'no']">{{ handoverStatusLabel(record) }}</span>

              </div>
            </div>

                          <option value="project_admin">项目管理员</option>

                  <span :class="['status-badge', governanceLoading ? 'no' : 'ok']">{{ governanceLoading ? '读取中' : '策略已生效' }}</span>
