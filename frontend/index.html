              <div class="governance-workspace">
                <section class="governance-policy-panel" aria-label="数据保留策略">
                  <div class="governance-panel-title"><span>01</span><div><strong>保留策略</strong><small>项目级默认规则</small></div></div>
                  <div class="governance-policy-grid">
                    <label>飞书原文保留天数<input class="form-input" type="number" min="7" max="3650" v-model.number="governancePolicy.raw_message_retention_days" /></label>
                    <label>访问审计保留天数<input class="form-input" type="number" min="30" max="3650" v-model.number="governancePolicy.access_audit_retention_days" /></label>
                    <label>运行任务保留天数<input class="form-input" type="number" min="7" max="3650" v-model.number="governancePolicy.processing_history_retention_days" /></label>
                    <label>普通备份保留份数<input class="form-input" type="number" min="1" max="100" v-model.number="governancePolicy.backup_retention_count" /></label>
                    <label>默认敏感级别<select class="form-select" v-model="governancePolicy.default_sensitivity"><option value="public">公开</option><option value="internal">内部</option><option value="confidential">机密</option><option value="restricted">严格受限</option></select></label>
                    <label>每日执行时间<input class="form-input" type="time" v-model="governancePolicy.schedule_time" /></label>
                    <label>调度时区<select class="form-select" v-model="governancePolicy.timezone"><option value="Asia/Shanghai">Asia/Shanghai</option><option value="Asia/Hong_Kong">Asia/Hong_Kong</option><option value="Asia/Tokyo">Asia/Tokyo</option><option value="UTC">UTC</option></select></label>
                    <label class="governance-toggle"><input type="checkbox" v-model="governancePolicy.daily_backup_enabled" /><span>每日自动创建并校验备份</span></label>
                    <label class="governance-toggle"><input type="checkbox" v-model="governancePolicy.daily_retention_enabled" /><span>每日自动执行保留期清理</span></label>
                  </div>
                  <button class="btn-primary" type="button" @click="saveDataGovernancePolicy" :disabled="governanceActionLoading === 'policy'">{{ governanceActionLoading === 'policy' ? '保存中' : '保存策略' }}</button>
                </section>

                <section class="governance-retention-panel" aria-label="清理影响预演">
                  <div class="governance-panel-title"><span>02</span><div><strong>清理预演</strong><small>当前策略影响范围</small></div></div>
                  <div class="governance-impact-grid">
                    <div><strong>{{ governancePreview.raw_message_redaction_count || 0 }}</strong><span>旧原文待脱敏</span></div>
                    <div><strong>{{ governancePreview.access_audit_expiry_count || 0 }}</strong><span>访问日志到期</span></div>
                    <div><strong>{{ governancePreview.processing_job_expiry_count || 0 }}</strong><span>运行记录到期</span></div>
                    <div><strong>{{ governancePreview.retained_asset_history_count || 0 }}</strong><span>资产历史保留</span></div>
                  </div>
                  <div class="governance-confirm-row">
                    <input class="form-input" v-model.trim="governanceConfirm" placeholder="输入：执行数据清理" />
                    <button class="btn-danger" type="button" @click="applyDataRetention" :disabled="governanceConfirm !== '执行数据清理' || governanceActionLoading === 'retention'">{{ governanceActionLoading === 'retention' ? '提交中' : '执行清理' }}</button>
                  </div>
                </section>

                <section class="governance-backup-panel" aria-label="数据库备份">
                  <div class="governance-panel-title"><span>03</span><div><strong>可靠备份</strong><small>SQLite 一致性副本</small></div></div>
                  <div class="governance-backup-toolbar"><span>{{ governanceBackups.length }} 份可用备份</span><button class="btn-primary" type="button" @click="createDataBackup" :disabled="governanceActionLoading === 'backup'">{{ governanceActionLoading === 'backup' ? '提交中' : '立即备份' }}</button></div>
                  <div class="governance-backup-list">
                    <div v-for="backup in governanceBackups.slice(0, 4)" :key="backup.name"><span :class="['governance-backup-mark', backup.valid ? 'ok' : 'bad']">{{ backup.valid ? '✓' : '!' }}</span><div><strong>{{ backup.name }}</strong><small>{{ formatFileSize(backup.size) }} · {{ formatFeishuTime(backup.created_at) }}</small></div><em>{{ backup.kind === 'safety' ? '恢复保护' : '普通备份' }}</em></div>
                    <p v-if="!governanceBackups.length" class="feishu-empty-inline">暂无备份记录</p>
                  </div>
                  <small class="governance-offline-note">数据库恢复需停止服务后使用维护命令执行。</small>
                  <div class="governance-schedule-summary">
                    <div><strong>每日调度</strong><small>下次扫描窗口：{{ formatFeishuTime(governanceSchedule.next_scheduled_at) }}</small></div>
                    <button class="btn-secondary" type="button" @click="scanDataGovernanceSchedule" :disabled="governanceActionLoading === 'schedule-scan'">{{ governanceActionLoading === 'schedule-scan' ? '扫描中' : '立即扫描' }}</button>
                  </div>
                  <div class="governance-schedule-list">
                    <div v-for="intent in governanceSchedule.latest_intents.slice(0, 4)" :key="intent.intent_id"><span class="audit-action-dot" aria-hidden="true"></span><div><strong>{{ governanceScheduleOperationLabel(intent.operation) }}</strong><small>{{ intent.local_date }} · {{ processingJobStatusLabel(intent.processing_status) }}</small></div><button class="btn-link" type="button" @click="tab = 'jobs'; processingJobKeyword = intent.processing_job_id; loadProcessingJobs()">查看任务</button></div>
                    <p v-if="!governanceSchedule.latest_intents.length" class="feishu-empty-inline">尚未生成每日调度记录</p>
                  </div>
                </section>

                <section class="governance-target-panel" aria-label="定向数据治理">
                  <div class="governance-panel-title"><span>04</span><div><strong>定向删除与导出</strong><small>来源、成员或单资产</small></div></div>
                  <div class="governance-target-form">
                    <select class="form-select" v-model="governanceTarget.target_type" @change="governanceTargetPreview = null; governanceTarget.confirmation = ''"><option value="source">知识来源</option><option value="user">项目成员</option><option value="asset">单个资产</option></select>
                    <input class="form-input" v-model.trim="governanceTarget.target_id" @input="governanceTargetPreview = null; governanceTarget.confirmation = ''" placeholder="输入稳定 ID" @keyup.enter="previewGovernanceTarget" />
                    <button class="btn-secondary" type="button" @click="previewGovernanceTarget" :disabled="!governanceTarget.target_id || governanceActionLoading === 'target-preview'">{{ governanceActionLoading === 'target-preview' ? '核对中' : '预演范围' }}</button>
                  </div>
                  <p class="governance-target-note">删除会撤销权威知识、清除原件正文与派生投影；审计和不可变交接快照继续保留。</p>
                  <div v-if="governanceTargetPreview" class="governance-target-preview">
                    <div class="governance-target-summary"><strong>{{ governanceTargetPreview.target_label }}</strong><span>{{ governanceTargetPreview.active_asset_count }} 个有效资产将失效</span></div>
                    <div class="governance-impact-grid compact">
                      <div><strong>{{ governanceTargetPreview.source_count }}</strong><span>来源</span></div>
                      <div><strong>{{ governanceTargetPreview.asset_count }}</strong><span>资产</span></div>
                      <div><strong>{{ governanceTargetPreview.document_count }}</strong><span>原件</span></div>
                      <div><strong>{{ governanceTargetPreview.chunk_count }}</strong><span>知识块</span></div>
                    </div>
                    <div class="governance-target-actions"><button class="btn-secondary" type="button" @click="exportGovernanceTarget" :disabled="governanceActionLoading === 'target-export'">{{ governanceActionLoading === 'target-export' ? '导出中' : '导出 JSON' }}</button><span>先导出可留存删除前副本</span></div>
                    <div class="governance-confirm-row"><input class="form-input" v-model.trim="governanceTarget.confirmation" placeholder="输入：永久删除定向数据" /><button class="btn-danger" type="button" @click="deleteGovernanceTarget" :disabled="governanceTarget.confirmation !== '永久删除定向数据' || governanceActionLoading === 'target-delete'">{{ governanceActionLoading === 'target-delete' ? '提交中' : '永久删除' }}</button></div>
                  </div>
                </section>

                <section class="governance-audit-panel" aria-label="项目审计记录">
                  <div class="governance-audit-head"><div class="governance-panel-title"><span>05</span><div><strong>访问与变更审计</strong><small>{{ governanceAuditTotal }} 条项目记录</small></div></div><button class="btn-secondary" type="button" @click="exportGovernanceAudit" :disabled="governanceActionLoading === 'export'">导出 CSV</button></div>
                  <div class="governance-audit-filter"><select class="form-select" v-model="governanceAuditAction" @change="loadGovernanceAudit"><option value="">全部动作</option><option value="access.knowledge_answer">知识问答访问</option><option value="access.document_preview">文档预览</option><option value="access.knowledge_graph">图谱访问</option><option value="governance.policy_updated">策略更新</option><option value="governance.backup_created">数据库备份</option><option value="governance.retention_applied">数据清理</option><option value="governance.target_exported">定向导出</option><option value="governance.target_deleted">定向删除</option><option value="iam.permission_denied">权限拒绝</option></select><input class="form-input" v-model.trim="governanceAuditKeyword" placeholder="操作者、对象或动作" @keyup.enter="loadGovernanceAudit" /><button class="btn-secondary" type="button" @click="loadGovernanceAudit">查询</button></div>
                  <div class="governance-audit-list">
                    <div v-for="event in governanceAudit" :key="event.audit_id"><span class="audit-action-dot" aria-hidden="true"></span><div><strong>{{ governanceAuditLabel(event.action) }}</strong><small>{{ event.actor }} · {{ event.object_type }} / {{ event.object_id }}</small></div><time>{{ formatFeishuTime(event.created_at) }}</time></div>
                    <p v-if="!governanceAudit.length" class="feishu-empty-inline">暂无匹配审计记录</p>
                  </div>
                </section>
              </div>
              <p v-if="governanceMessage" :class="['settings-msg', governanceMessage.startsWith('失败') ? 'err' : 'ok']">{{ governanceMessage }}</p>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- 上传弹窗 -->
  <div v-if="ragEvaluationEnabled && ragEvaluationOpen && can('knowledge.manage')" class="modal-overlay" @click.self="!ragEvaluationLoading && (ragEvaluationOpen = false)">
    <div class="modal-content rag-evaluation-modal" role="dialog" aria-modal="true" aria-labelledby="ragEvaluationTitle">
      <header class="modal-header">
        <div>
          <span class="eyebrow">PRD-RAG-001</span>
          <h2 id="ragEvaluationTitle">RAG 回归评测</h2>
          <p>评测用户权限内的检索证据、引用有效性、允许来源与无答案判断；生产试点每个版本至少维护 30 题。</p>
        </div>
        <button class="close-btn" @click="ragEvaluationOpen = false" :disabled="ragEvaluationLoading">×</button>
      </header>
      <div class="rag-evaluation-layout">
        <aside class="rag-evaluation-sidebar">
          <div class="rag-evaluation-set-list">
            <button v-for="item in ragEvaluationSets" :key="item.evaluation_set_id" type="button"
                    :class="{ active: selectedRagEvaluationSet?.evaluation_set_id === item.evaluation_set_id }"
                    @click="selectRagEvaluationSet(item.evaluation_set_id)">
              <span><strong>{{ item.name }}</strong><small>v{{ item.version }} · {{ item.case_count }}/{{ item.min_case_target }} 题</small></span>
              <em :class="item.ready ? 'ready' : 'draft'">{{ item.ready ? '就绪' : '待补充' }}</em>
            </button>
            <p v-if="!ragEvaluationSets.length" class="empty-hint">暂无评测集。</p>
          </div>
          <form class="rag-evaluation-create" @submit.prevent="createRagEvaluationSet">
            <h3>新建版本化评测集</h3>
            <input v-model="ragEvaluationSetDraft.name" maxlength="120" placeholder="例如：项目真实问题回归" required />
            <div><label>版本</label><input v-model.number="ragEvaluationSetDraft.version" type="number" min="1" max="999" /></div>
            <textarea v-model="ragEvaluationSetDraft.description" maxlength="1000" placeholder="本版本策略或变更说明"></textarea>
            <button class="btn-primary" type="submit" :disabled="ragEvaluationLoading || !ragEvaluationSetDraft.name.trim()">创建评测集</button>
          </form>
        </aside>

        <section v-if="selectedRagEvaluationSet" class="rag-evaluation-detail">
          <header>
            <div>
              <span>v{{ selectedRagEvaluationSet.version }}</span>
              <h3>{{ selectedRagEvaluationSet.name }}</h3>
              <p>{{ selectedRagEvaluationSet.description || '未填写版本说明' }}</p>
            </div>
            <div class="rag-evaluation-readiness">
              <strong>{{ selectedRagEvaluationSet.case_count }}/{{ selectedRagEvaluationSet.min_case_target }}</strong>
              <small>{{ selectedRagEvaluationSet.ready ? '已达到生产题量门槛' : '尚未达到生产题量门槛' }}</small>
              <button class="btn-primary" type="button" :disabled="ragEvaluationLoading || !selectedRagEvaluationSet.case_count" @click="runRagEvaluation">
                {{ ragEvaluationLoading ? '运行中' : '运行当前策略' }}
              </button>
            </div>
          </header>

          <div v-if="selectedRagEvaluationSet.runs?.length" class="rag-evaluation-metrics">
            <div><span>通过率</span><strong>{{ Math.round((selectedRagEvaluationSet.runs[0].metrics.pass_rate || 0) * 100) }}%</strong></div>
            <div><span>引用有效率</span><strong>{{ Math.round((selectedRagEvaluationSet.runs[0].metrics.citation_validity_rate || 0) * 100) }}%</strong></div>
            <div><span>无答案准确率</span><strong>{{ Math.round((selectedRagEvaluationSet.runs[0].metrics.no_answer_accuracy || 0) * 100) }}%</strong></div>
            <div><span>权限泄露</span><strong>{{ selectedRagEvaluationSet.runs[0].metrics.permission_leak_count || 0 }}</strong></div>
          </div>

          <div class="rag-evaluation-cases">
            <article v-for="(item, index) in selectedRagEvaluationSet.cases" :key="item.evaluation_case_id">
              <span>{{ index + 1 }}</span>
              <div><strong>{{ item.question }}</strong><small>{{ item.scenario }} · {{ item.expect_no_answer ? '预期无答案' : `${item.expected_points.length} 个答案要点` }}</small></div>
            </article>
            <p v-if="!selectedRagEvaluationSet.cases.length" class="empty-hint">先加入第一道真实项目问题。</p>
          </div>

          <form class="rag-evaluation-case-form" @submit.prevent="addRagEvaluationCase">
            <h3>加入评测问题</h3>
            <textarea v-model="ragEvaluationCaseDraft.question" maxlength="2000" placeholder="真实项目问题" required></textarea>
            <div class="rag-evaluation-case-options">
              <select v-model="ragEvaluationCaseDraft.scenario" :disabled="ragEvaluationCaseDraft.expectNoAnswer">
                <option value="fact">事实</option><option value="process">流程</option><option value="decision">决策</option>
                <option value="risk">风险</option><option value="handover">交接</option>
              </select>
              <label><input v-model="ragEvaluationCaseDraft.expectNoAnswer" type="checkbox" /> 预期应回答“当前知识不足”</label>
            </div>
            <textarea v-if="!ragEvaluationCaseDraft.expectNoAnswer" v-model="ragEvaluationCaseDraft.expectedPoints" placeholder="期望答案要点，每行一个" required></textarea>
            <textarea v-model="ragEvaluationCaseDraft.allowedSources" placeholder="允许来源文件名，每行一个（可选）"></textarea>
            <button class="btn-primary" type="submit" :disabled="ragEvaluationLoading || !ragEvaluationCaseDraft.question.trim()">加入评测集</button>
          </form>
        </section>
        <section v-else class="rag-evaluation-empty"><strong>选择或创建评测集</strong><p>每次策略更新前后运行同一版本，比较检索和引用质量。</p></section>
      </div>
      <p v-if="ragEvaluationMessage" class="rag-evaluation-message">{{ ragEvaluationMessage }}</p>
    </div>
  </div>

  <div v-if="showUploadModal && can('knowledge.upload')" class="modal-overlay" @click.self="closeUploadModal">
    <div class="modal-content upload-modal">
      <div class="modal-header">
        <div><h3>{{ knowledgeTaskUploadContext ? '上传任务资料' : uploadMode === 'update' ? '上传知识新版本' : '上传新知识' }}</h3><p>{{ knowledgeTaskUploadContext ? `为“${knowledgeTaskUploadContext.title}”补充资料；资料将作为新的知识资产入库。` : uploadMode === 'update' ? '选择已有资产并追加可审计的新版本' : '创建新的知识资产与首个版本' }}</p></div>
        <button class="btn-icon" @click="closeUploadModal">关闭</button>

      <div class="upload-form">
        <div v-if="!knowledgeTaskUploadContext" class="upload-mode-switch" role="tablist" aria-label="上传方式">
          <button type="button" role="tab" :aria-selected="uploadMode === 'create'" :class="{ active: uploadMode === 'create' }" @click="setUploadMode('create')">新建知识</button>

            <option value="">请选择有权更新的知识资产</option>
            <option v-for="asset in uploadUpdatableAssets" :key="knowledgeAssetId(asset)" :value="knowledgeAssetId(asset)">{{ knowledgeAssetTitle(asset) }} · {{ knowledgeVersionLabel(asset) }}</option>

          <small v-if="uploadTargetAsset">当前来源：{{ knowledgeAssetSource(uploadTargetAsset) }}</small>
          <small v-else-if="!uploadUpdatableAssets.length" class="upload-field-warning">当前没有可更新的知识资产，请先新建知识或联系知识运营人员。</small>
          <p>即使新文件改名，也会作为同一知识资产的新版本保存，原版本与审计记录继续保留。</p>

        <div class="form-group">
          <label>上传者姓名 <span class="required">*</span></label>
          <input :value="currentUser.display_name" class="form-input" readonly />

          <label>文档分类 <span class="required">*</span></label>
          <select v-model="uploadCategory" class="form-select">
            <option value="">请选择分类，不选则由 AI 自动分类</option>
            <option v-for="cat in categories" :key="cat" :value="cat">{{ categoryLabel(cat) }}</option>
          </select>
        </div>
        <div class="form-group">
          <label>{{ knowledgeTaskUploadContext || uploadMode === 'create' ? '选择一个或多个文件' : '选择文件' }} <span class="required">*</span></label>
          <div class="kb-upload-area" @click="$refs.kbFileInput.click()">
            <p>{{ uploadFileName || (knowledgeTaskUploadContext ? '点击选择任务资料，可批量选择（PDF / 图片 / TXT / MD / DOCX / CSV / JSON）' : uploadMode === 'create' ? '点击选择文档，可批量选择（PDF / 图片 / TXT / MD / DOCX / CSV / JSON）' : '点击选择新版本文件（PDF / 图片 / TXT / MD / DOCX / CSV / JSON）') }}</p>
          </div>
          <input :key="uploadInputKey" type="file" ref="kbFileInput" :multiple="knowledgeTaskUploadContext || uploadMode === 'create'" accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.md,.docx,.csv,.json,application/json,image/png,image/jpeg,image/webp" @change="onKbFileChange" hidden />
          <small v-if="graphImportHint" class="json-import-hint">{{ graphImportHint }}</small>
        </div>
        <div class="form-actions">
          <button class="btn-primary" @click="submitKbUpload" :disabled="kbUploading || !uploadFileSelected || (uploadMode === 'update' && !uploadTargetAsset)">{{ kbUploading ? '提交中' : knowledgeTaskUploadContext ? '上传并关联任务' : uploadMode === 'update' ? '上传新版本' : '创建知识' }}</button>
          <button class="btn-secondary" @click="closeUploadModal" :disabled="kbUploading">取消</button>

  <!-- 知识资产详情与治理 -->
  <div v-if="selectedKnowledgeAsset" class="modal-overlay" @click.self="closeKnowledgeAsset">
    <div class="modal-content knowledge-asset-modal" role="dialog" aria-modal="true" aria-labelledby="knowledgeAssetTitle">
      <div class="modal-header knowledge-asset-modal-head">
        <div>
          <span v-if="!knowledgeAssetDetailUnavailable" :class="['asset-status-badge', knowledgeStatusTone(selectedKnowledgeAsset)]">{{ knowledgeStatusLabel(selectedKnowledgeAsset) }}</span>
          <h3 id="knowledgeAssetTitle">{{ knowledgeAssetDetailUnavailable ? '知识资产详情' : knowledgeAssetTitle(selectedKnowledgeAsset) }}</h3>
          <p v-if="!knowledgeAssetDetailUnavailable">{{ knowledgeAssetSource(selectedKnowledgeAsset) }}</p>
        </div>
        <button class="btn-icon" @click="closeKnowledgeAsset">关闭</button>
      </div>

      <div v-if="knowledgeAssetDetailUnavailable" :class="['knowledge-state-panel', knowledgeAssetDetailUnavailable === 'denied' ? 'denied' : 'error']">
        <strong>{{ knowledgeAssetDetailUnavailable === 'denied' ? '无权查看资产详情' : '知识资产不可用' }}</strong>
        <p>{{ knowledgeAssetDetailUnavailable === 'denied' ? '该资产的来源权限已发生变化，旧详情已清除。请联系项目管理员确认授权范围。' : knowledgeAssetDetailError }}</p>
        <button class="btn-secondary" @click="closeKnowledgeAsset">关闭</button>
      </div>
      <template v-else>
        <div class="knowledge-asset-modal-actions">
          <button class="btn-secondary" @click="previewKnowledgeAssetSource(selectedKnowledgeAsset)">预览当前来源</button>
          <span>{{ knowledgeVisibilityLabel(selectedKnowledgeAsset) }} · {{ knowledgeVisibilityDetail(selectedKnowledgeAsset) }}</span>
        </div>

        <div v-if="knowledgeAssetMessage" :class="['settings-msg', knowledgeMessageIsError(knowledgeAssetMessage) ? 'err' : 'ok']">{{ knowledgeAssetMessage }}</div>

        <div class="knowledge-asset-detail-grid">
          <section class="knowledge-asset-info-panel">
            <div class="knowledge-detail-heading">
              <div><small>资产信息</small><h4>{{ can('knowledge.manage') ? '维护责任与有效期' : '可信知识信息' }}</h4></div>
              <span>{{ knowledgeVersionLabel(selectedKnowledgeAsset) }}</span>
            </div>

            <div v-if="can('knowledge.manage')" class="knowledge-governance-form">
              <label>资产标题<input v-model.trim="knowledgeAssetDraft.title" class="form-input" /></label>
              <label>责任人
                <select v-model="knowledgeAssetDraft.owner_user_id" class="form-select">
                  <option value="">待分配</option>
                  <option v-for="member in projectMembers.filter(item => item.membership_status === 'active')" :key="member.user_id" :value="member.user_id">{{ member.display_name }}</option>
                </select>
              </label>
              <label>复审日期<input v-model="knowledgeAssetDraft.review_due_at" type="date" class="form-input" /></label>
              <label>可见范围
                <select v-model="knowledgeAssetDraft.visibility" class="form-select">
                  <option v-for="option in knowledgeVisibilityOptions(selectedKnowledgeAsset)" :key="option.value" :value="option.value"
                          :disabled="option.value === 'private' && !knowledgeAssetDraft.owner_user_id">{{ option.label }}</option>
                </select>
                <small v-if="!knowledgeAssetDraft.owner_user_id">选择责任人后，才可设置为“仅责任人”。</small>
                <small v-else>来源权限为“{{ knowledgeVisibilityLabel({ visibility: knowledgeSourceVisibility(selectedKnowledgeAsset) }) }}”，资产只能进一步收紧。</small>
              </label>
              <button class="btn-primary" :disabled="knowledgeAssetSaving" @click="saveKnowledgeAsset">{{ knowledgeAssetSaving ? '保存中' : '保存资产信息' }}</button>
            </div>

            <dl v-else class="knowledge-asset-readonly">
              <div><dt>责任人</dt><dd>{{ knowledgeOwnerName(selectedKnowledgeAsset) }}</dd></div>
              <div><dt>状态</dt><dd>{{ knowledgeStatusLabel(selectedKnowledgeAsset) }}</dd></div>
              <div><dt>复审</dt><dd>{{ knowledgeReviewMeta(selectedKnowledgeAsset).label }}</dd></div>
              <div><dt>权限</dt><dd>{{ knowledgeVisibilityLabel(selectedKnowledgeAsset) }}</dd></div>
              <div><dt>分类</dt><dd>{{ knowledgeAssetCategoryLabel(selectedKnowledgeAsset) }}</dd></div>
            </dl>

            <div v-if="can('knowledge.publish')" class="knowledge-transition-panel">
              <div><small>生命周期操作</small><strong>当前：{{ knowledgeStatusLabel(selectedKnowledgeAsset) }}</strong></div>
              <div class="knowledge-transition-actions" v-if="knowledgeAvailableTransitions(selectedKnowledgeAsset).length">
                <button v-for="action in knowledgeAvailableTransitions(selectedKnowledgeAsset)" :key="action.action"
                        :class="action.tone === 'primary' ? 'btn-primary' : action.tone === 'danger' ? 'btn-danger-sm' : 'btn-secondary'"
                        :disabled="knowledgeAssetSaving || action.disabled || (action.action === 'revoke' && !knowledgeRevokeReason.trim())"
                        :title="action.disabledReason || ''" @click="transitionKnowledgeAsset(action.action)">{{ action.label }}</button>
              </div>
              <small v-for="action in knowledgeAvailableTransitions(selectedKnowledgeAsset).filter(item => item.disabledReason)" :key="`${action.action}-reason`" class="knowledge-transition-note">{{ action.label }}：{{ action.disabledReason }}</small>
              <span v-if="!knowledgeAvailableTransitions(selectedKnowledgeAsset).length">该资产当前没有可执行的状态操作。</span>
              <label v-if="knowledgeAvailableTransitions(selectedKnowledgeAsset).some(action => action.action === 'revoke')" class="knowledge-revoke-reason">
                <span>撤销原因 <b>必填</b></span>
                <textarea v-model.trim="knowledgeRevokeReason" class="form-input" rows="2" maxlength="300" placeholder="说明撤销依据，便于审计和后续复盘"></textarea>
              </label>
            </div>
          </section>

          <section class="knowledge-version-panel">
            <div class="knowledge-detail-heading">
              <div><small>版本与来源</small><h4>处理历史</h4></div>
              <span>{{ knowledgeAssetVersions.length }} 个版本</span>
            </div>
            <div v-if="knowledgeAssetDetailLoading" class="knowledge-version-loading" aria-live="polite"><span></span><span></span><span></span></div>
            <div v-else-if="knowledgeAssetDetailError" class="knowledge-inline-error">
              <p>{{ knowledgeAssetDetailError }}</p>
              <button class="btn-sm" @click="openKnowledgeAsset(selectedKnowledgeAsset)">重试</button>
            </div>
            <template v-else-if="knowledgeAssetVersions.length">
              <div v-if="knowledgeCurrentVersion(selectedKnowledgeAsset)" class="knowledge-current-version">
                <div class="knowledge-current-version-head">
                  <div><small>当前版本</small><strong>{{ knowledgeVersionName(knowledgeCurrentVersion(selectedKnowledgeAsset), 0) }} · {{ knowledgeVersionStatus(knowledgeCurrentVersion(selectedKnowledgeAsset)) }}</strong></div>
                  <span>{{ knowledgeVersionDocuments(knowledgeCurrentVersion(selectedKnowledgeAsset)).length }} 个来源</span>
                </div>
                <div v-if="knowledgeVersionDocuments(knowledgeCurrentVersion(selectedKnowledgeAsset)).length" class="knowledge-source-list">
                  <button v-for="source in knowledgeVersionDocuments(knowledgeCurrentVersion(selectedKnowledgeAsset))" :key="source.document_id || source.stored_file" @click="previewDoc(source)">
                    <span>{{ source.source_file || source.stored_file || '未命名来源' }}</span><small>{{ source.status || '状态未知' }}</small>
                  </button>
                </div>
                <div v-else class="knowledge-source-empty">当前版本没有关联来源文件</div>
                <div v-if="knowledgeProjectionItems(knowledgeCurrentVersion(selectedKnowledgeAsset)).length" class="knowledge-projection-grid">
                  <div v-for="projection in knowledgeProjectionItems(knowledgeCurrentVersion(selectedKnowledgeAsset))" :key="projection.key" :class="['knowledge-projection-item', projection.status]" :title="projection.error">
                    <span>{{ projection.label }}</span><strong>{{ knowledgeProjectionLabel(projection.status) }}</strong>
                  </div>
                </div>
                <button v-if="can('knowledge.manage') && knowledgeAssetNeedsRepair(selectedKnowledgeAsset)"
                        class="btn-secondary knowledge-repair-button" :disabled="knowledgeAssetSaving"
                        @click="repairKnowledgeAssetProjections">
                  {{ knowledgeAssetSaving ? '修复中' : '修复同步状态' }}
                </button>
              </div>
              <ol class="knowledge-version-list">
                <li v-for="(version, idx) in knowledgeAssetVersions" :key="version.version_id || idx" :class="{ current: isKnowledgeCurrentVersion(version) }">
                  <span>{{ knowledgeVersionName(version, idx) }}</span>
                  <div>
                    <strong>{{ isKnowledgeCurrentVersion(version) ? '当前生效版本' : knowledgeVersionStatus(version) }}</strong>
                    <small>{{ formatKnowledgeDate(version.created_at || version.updated_at || version.effective_at, true) || '时间待补充' }} · {{ version.created_by || '系统处理' }} · {{ knowledgeVersionDocuments(version).length }} 个来源</small>
                    <p v-if="version.summary || version.content_summary">{{ version.summary || version.content_summary }}</p>
                    <p v-if="version.failure_reason" class="knowledge-version-failure">失败原因：{{ version.failure_reason }}</p>
                    <div v-if="knowledgeProjectionItems(version).length" class="knowledge-version-projections">
                      <span v-for="projection in knowledgeProjectionItems(version)" :key="projection.key" :class="projection.status">{{ projection.label }}：{{ knowledgeProjectionLabel(projection.status) }}</span>
                    </div>
                  </div>
                  <div class="knowledge-version-actions">
                    <em :class="{ failed: String(version.processing_status || version.status).toLowerCase() === 'failed' }">{{ knowledgeVersionStatus(version) }}</em>
                    <button type="button" class="btn-text" :disabled="!version.version_id || knowledgeVersionPreviewingId === version.version_id" @click="previewKnowledgeVersion(version)">
                      {{ knowledgeVersionPreviewingId === version.version_id ? '读取中' : '预览此版本' }}
                    </button>
                  </div>
                </li>
              </ol>
            </template>
            <div v-else class="knowledge-version-empty"><strong>暂无历史版本</strong><p>当前资产只有一个生效来源，后续更新会在这里保留处理和切换记录。</p></div>
          </section>
        </div>
      </template>
    </div>
  </div>

  <!-- 交接清单与风险闭环 -->
  <div v-if="showHandoverModal && selectedHandover" class="modal-overlay" @click.self="!handoverActionLoading && (showHandoverModal = false)">
    <div class="modal-content handover-governance-modal" role="dialog" aria-modal="true" aria-labelledby="handoverGovernanceTitle">
      <div class="modal-header">
        <div><span class="feature-head-eyebrow">责任转移</span><h3 id="handoverGovernanceTitle">{{ selectedHandover.name }} · 交接清单</h3></div>
        <button class="btn-icon" :disabled="!!handoverActionLoading" @click="showHandoverModal = false">关闭</button>
      </div>
      <div v-if="handoverDetailLoading" class="knowledge-task-state">正在读取交接清单与风险…</div>
      <template v-else>
        <p v-if="handoverActionMessage" class="knowledge-task-feedback" role="status">{{ handoverActionMessage }}</p>
        <section class="handover-governance-summary">
          <div class="handover-completion-score" :style="{ '--handover-progress': `${selectedHandover.completion || 0}%` }"><strong>{{ selectedHandover.completion || 0 }}%</strong><span>交接完成度</span></div>
          <div class="handover-completion-breakdown">
            <article><span>必交项 · 60%</span><strong>{{ selectedHandover.completion_breakdown?.required_accepted || 0 }} / {{ selectedHandover.completion_breakdown?.required_total || 0 }}</strong><small>必须逐项提交证据并由接替人验收</small></article>
            <article><span>风险关闭 · 20%</span><strong>{{ selectedHandover.completion_breakdown?.risk_closed || 0 }} / {{ selectedHandover.completion_breakdown?.risk_total || 0 }}</strong><small>阻断风险未关闭时禁止完成</small></article>
            <article><span>接替确认 · 20%</span><strong>{{ selectedHandover.completion_gates?.recipient_confirmed ? '已确认' : '待确认' }}</strong><small>{{ selectedHandover.learning_plan_status === 'ready' ? '学习计划已就绪' : '学习计划仍待处理' }}</small></article>
          </div>
        </section>
        <div v-if="handoverMyActions.length" class="handover-my-actions">
          <div class="handover-my-actions-head"><strong>待我处理</strong><small>按当前身份的下一步动作，点击定位到对应分组</small></div>
          <div class="handover-my-actions-list">
            <button v-for="action in handoverMyActions" :key="action.key" type="button" class="handover-action-chip" @click="focusHandoverSection(action.section)">{{ action.label }}</button>
          </div>
        </div>
        <div v-if="selectedHandover.risks?.length" class="handover-gate-warnings"><span v-for="warning in selectedHandover.risks" :key="warning">{{ warning }}</span></div>
        <div v-if="selectedHandover.snapshot" class="handover-snapshot-seal"><div><strong>不可变快照已封存</strong><small>{{ formatKnowledgeDate(selectedHandover.snapshot.created_at, true) }} · 校验 {{ selectedHandover.snapshot.checksum.slice(0, 16) }}…</small></div><span>只读</span></div>

        <section id="handover-section-inventory" class="handover-governance-section" aria-labelledby="handoverInventoryTitle">
          <div class="handover-governance-section-head" role="button" tabindex="0" :aria-expanded="handoverSectionIsOpen('inventory')" @click="toggleHandoverSection('inventory')" @keydown.enter.prevent="toggleHandoverSection('inventory')">
            <div><span>自动盘点</span><h4 id="handoverInventoryTitle">离职人员关联知识与未完成任务</h4></div>
            <div class="handover-section-meta">
              <small>系统按稳定成员 ID 盘点责任、创建、维护、任务参与和图谱来源；接替人需逐项纳入或说明排除原因。</small>
              <span :class="['handover-section-count', { pending: selectedHandover.inventory_summary?.pending }]">{{ selectedHandover.inventory_summary?.pending ? `${selectedHandover.inventory_summary.pending} 项待审阅` : '已全部审阅' }}</span>
              <span class="handover-section-toggle">{{ handoverSectionIsOpen('inventory') ? '收起' : '展开' }}</span>
            </div>
          </div>
          <div v-show="handoverSectionIsOpen('inventory')">
            <div class="handover-inventory-summary">
              <span><strong>{{ selectedHandover.inventory_summary?.total || 0 }}</strong>识别总数</span>
              <span><strong>{{ selectedHandover.inventory_summary?.by_source?.knowledge_asset || 0 }}</strong>知识资产</span>
              <span><strong>{{ selectedHandover.inventory_summary?.by_source?.knowledge_task || 0 }}</strong>未完成任务</span>
              <span><strong>{{ selectedHandover.inventory_summary?.by_source?.graph_topic || 0 }}</strong>图谱主题</span>
              <span :class="{ pending: selectedHandover.inventory_summary?.pending }"><strong>{{ selectedHandover.inventory_summary?.pending || 0 }}</strong>待审阅</span>
              <button v-if="selectedHandover.status !== 'completed' && canReviewHandover()" class="btn-secondary" :disabled="!!handoverActionLoading" @click="refreshHandoverInventory">{{ handoverActionLoading === 'inventory:refresh' ? '盘点中' : '重新盘点' }}</button>
            </div>
            <div v-if="handoverInventorySorted.length" class="handover-inventory-list">
              <article v-for="entry in handoverInventorySorted" v-show="entry.status === 'pending' || handoverClosedVisible('inventory')" :key="entry.inventory_id" :class="['handover-inventory-card', entry.status]">
                <header><span>{{ handoverInventorySourceLabel(entry.source_type) }}</span><em :class="['task-status', entry.status === 'included' ? 'done' : entry.status === 'excluded' ? 'muted' : 'warn']">{{ handoverInventoryStatusLabel(entry.status) }}</em></header>
                <strong>{{ entry.title }}</strong><p>{{ entry.relation_detail }}</p>
                <small v-if="entry.metadata?.status">当前状态：{{ entry.metadata.status }}<template v-if="entry.metadata?.priority"> · 优先级 {{ entry.metadata.priority }}</template></small>
                <small v-if="entry.version_id">资产版本：{{ entry.version_id }}</small>
                <div v-if="entry.exclusion_reason" class="handover-rejection"><strong>排除原因</strong><p>{{ entry.exclusion_reason }}</p></div>
                <div v-if="selectedHandover.status !== 'completed' && canReviewHandover()" class="handover-inventory-actions">
                  <template v-if="entry.status === 'pending'">
                    <template v-if="handoverInventoryExcludeIsActive(entry)">
                      <input v-model.trim="handoverInventoryExcludeDrafts[entry.inventory_id]" class="form-input" placeholder="排除时必须填写原因" />
                      <div><button class="btn-text" :disabled="!!handoverActionLoading" @click="cancelHandoverInventoryExclude(entry)">取消</button><button class="btn-secondary" :disabled="!!handoverActionLoading || !String(handoverInventoryExcludeDrafts[entry.inventory_id] || '').trim()" @click="actOnHandoverInventory(entry, 'exclude')">说明并排除</button><button class="btn-primary" :disabled="!!handoverActionLoading" @click="actOnHandoverInventory(entry, 'include')">纳入交接</button></div>
                    </template>
                    <div v-else><button class="btn-secondary" :disabled="!!handoverActionLoading" @click="beginHandoverInventoryExclude(entry)">说明并排除</button><button class="btn-primary" :disabled="!!handoverActionLoading" @click="actOnHandoverInventory(entry, 'include')">纳入交接</button></div>
                  </template>
                  <button v-else class="btn-text" :disabled="!!handoverActionLoading" @click="actOnHandoverInventory(entry, 'reset')">重新审阅</button>
                </div>
              </article>
            </div>
            <p v-else class="handover-record-empty">没有发现与该成员稳定关联的知识资产、未完成任务或图谱主题。可重新盘点，但系统不会用姓名模糊猜测归属。</p>
            <button v-if="handoverInventoryClosed.length" type="button" class="handover-closed-toggle" @click="toggleHandoverClosed('inventory')">{{ handoverClosedVisible('inventory') ? '收起' : '展开' }}已处理 {{ handoverInventoryClosed.length }} 项</button>
          </div>
        </section>

        <section id="handover-section-items" class="handover-governance-section" aria-labelledby="handoverItemsTitle">
          <div class="handover-governance-section-head" role="button" tabindex="0" :aria-expanded="handoverSectionIsOpen('items')" @click="toggleHandoverSection('items')" @keydown.enter.prevent="toggleHandoverSection('items')">
            <div><span>必交清单</span><h4 id="handoverItemsTitle">逐项提交与验收</h4></div>
            <div class="handover-section-meta">
              <small>证据可写资料位置、工单或验证结果；不要填写口令、密钥等敏感值。</small>
              <span :class="['handover-section-count', { pending: handoverItemsActionable.length }]">{{ handoverItemsActionable.length ? `${handoverItemsActionable.length} 项待处理` : '已全部验收' }}</span>
              <span class="handover-section-toggle">{{ handoverSectionIsOpen('items') ? '收起' : '展开' }}</span>
            </div>
          </div>
          <div v-show="handoverSectionIsOpen('items')">
          <div class="handover-item-grid">
            <article v-for="(item, index) in handoverItemsSorted" v-show="item.status !== 'accepted' || handoverClosedVisible('items')" :key="item.item_id" :class="['handover-item-card', item.status]">
              <header><span>{{ String(index + 1).padStart(2, '0') }}</span><div><strong>{{ item.title }}</strong><small>责任人：{{ handoverMemberName(item.owner_user_id) }} · 截止 {{ item.due_at || selectedHandover.due_date || '未设置' }}</small></div><em :class="['task-status', handoverItemStatusMeta[item.status]?.tone]">{{ handoverItemStatusLabel(item.status) }}</em></header>
              <p>{{ item.description }}</p>
              <div v-if="item.evidence" class="handover-evidence"><strong>提交证据</strong><p>{{ item.evidence }}</p></div>
              <div v-if="item.evidence_assets?.length" class="handover-evidence handover-evidence-assets">
                <strong>关联资料 · {{ item.evidence_assets.length }} 份</strong>
                <ul>
                  <li v-for="reference in item.evidence_assets" :key="`${reference.asset_id}:${reference.version_id}`">
                    <span :class="{ unavailable: !reference.available }">{{ handoverEvidenceReferenceLabel(reference) }}</span>
                    <small>{{ reference.source_kind === 'uploaded' ? '本项补充上传' : '已有资料' }}<template v-if="reference.source_file"> · {{ reference.source_file }}</template></small>
                  </li>
                </ul>
              </div>
              <div v-if="item.review_mode === 'proxy' && item.proxy_reason" class="handover-evidence"><strong>代验收记录 · {{ handoverMemberName(item.reviewed_by) }}</strong><p>{{ item.proxy_reason }}</p><small>{{ formatKnowledgeDate(item.reviewed_at, true) }}</small></div>
              <div v-if="item.rejection_reason" class="handover-rejection"><strong>退回要求</strong><p>{{ item.rejection_reason }}</p><small v-if="item.knowledge_task_id">补充任务：{{ item.knowledge_task_id }}</small></div>
              <div v-if="selectedHandover.status !== 'completed' && ['pending','rejected'].includes(item.status) && canSubmitHandoverItem(item)" class="handover-inline-action">
                <div class="handover-evidence-composer">
                  <div class="handover-evidence-composer-head">
                    <div><strong>资料与证据</strong><small>新关联仅显示双方可访问的当前资料；已关联资料会保留选定版本。</small></div>
                    <button type="button" class="btn-secondary" :disabled="handoverItemDraftSaving[item.item_id]" @click="loadHandoverItemSubmissionContext(item)">{{ Array.isArray(handoverItemAssetOptions[item.item_id]) ? '刷新可关联资料' : '关联已有资料' }}</button>
                  </div>
                  <div v-if="Array.isArray(handoverItemAssetOptions[item.item_id])" class="handover-existing-asset-picker">
                    <select v-model="handoverItemAssetPickers[item.item_id]" class="form-select" :disabled="handoverItemDraftSaving[item.item_id]">
                      <option value="">{{ handoverItemAssetOptions[item.item_id].length ? '选择已有资料' : '暂无双方均可访问的有效资料' }}</option>
                      <option v-for="asset in handoverItemAssetOptions[item.item_id]" :key="`${asset.asset_id}:${asset.version_id}`" :value="asset.asset_id">{{ asset.title }}<template v-if="asset.source_file"> · {{ asset.source_file }}</template></option>
                    </select>
                    <button type="button" class="btn-secondary" :disabled="handoverItemDraftSaving[item.item_id] || !handoverItemAssetPickers[item.item_id]" @click="addHandoverItemExistingAsset(item)">关联</button>
                  </div>
                  <div class="handover-evidence-upload-action">
                    <input :id="`handover-item-upload-${item.item_id}`" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.md,.docx,.csv,.json,application/json,image/png,image/jpeg,image/webp" hidden @change="uploadHandoverItemEvidenceFiles(item, $event)" />
                    <button type="button" class="btn-secondary" :disabled="handoverItemDraftSaving[item.item_id] || (handoverItemAssetRefs[item.item_id] || []).length >= 10" @click="$event.currentTarget.previousElementSibling.click()">{{ handoverItemDraftSaving[item.item_id] ? '处理中…' : '上传补充文件' }}</button>
                    <small>支持文档与图片；文件会先入库，再自动关联到本项草稿，最多 10 份。</small>
                  </div>
                  <ul v-if="handoverItemAssetRefs[item.item_id]?.length" class="handover-draft-asset-list">
                    <li v-for="reference in handoverItemAssetRefs[item.item_id]" :key="`${reference.asset_id}:${reference.version_id}`">
                      <span :class="{ unavailable: !reference.available }">{{ handoverEvidenceReferenceLabel(reference) }}</span>
                      <small>{{ reference.source_kind === 'uploaded' ? '补充上传' : '已有资料' }}</small>
                      <button type="button" class="btn-text" :disabled="handoverItemDraftSaving[item.item_id]" @click="removeHandoverItemDraftAsset(item, reference)">移除</button>
                    </li>
                  </ul>
                </div>
                <label class="handover-evidence-note">补充说明（可选）<textarea v-model.trim="handoverItemDrafts[item.item_id]" class="form-input" rows="2" placeholder="可补充文档章节、交接背景或验证结论" @input="scheduleHandoverItemDraftSave(item)"></textarea></label>
                <p v-if="handoverItemDraftMessages[item.item_id]" class="handover-draft-message" role="status">{{ handoverItemDraftMessages[item.item_id] }}</p>
                <div class="handover-inline-actions"><button type="button" class="btn-secondary" :disabled="handoverItemDraftSaving[item.item_id]" @click="saveHandoverItemDraft(item)">保存草稿</button><button class="btn-primary" :disabled="!!handoverActionLoading || handoverItemDraftSaving[item.item_id] || !handoverItemHasDraftEvidence(item)" @click="actOnHandoverItem(item, 'submit')">{{ item.status === 'rejected' ? '重新提交验收' : '提交验收' }}</button></div>
              </div>
              <p v-if="item.status === 'submitted' && item.review_block_reason" class="handover-review-waiting" role="status">{{ item.review_block_reason }}</p>
              <div v-if="selectedHandover.status !== 'completed' && item.status === 'submitted' && canReviewHandoverItem(item)" class="handover-inline-action review">
                <label v-if="item.review_action_mode === 'proxy'" class="handover-proxy-reason">代验收原因（必填）<textarea v-model.trim="handoverProxyReasonDrafts[item.item_id]" class="form-input" rows="2" maxlength="1000" placeholder="说明由你代替接替人验收的原因"></textarea></label>
                <input v-model.trim="handoverRejectDrafts[item.item_id]" class="form-input" placeholder="退回时填写明确的补充要求" />
                <div class="handover-inline-actions"><button class="btn-secondary" :disabled="!!handoverActionLoading || !String(handoverRejectDrafts[item.item_id] || '').trim() || (item.review_action_mode === 'proxy' && !String(handoverProxyReasonDrafts[item.item_id] || '').trim())" @click="actOnHandoverItem(item, 'reject')">退回补充</button><button class="btn-primary" :disabled="!!handoverActionLoading || (item.review_action_mode === 'proxy' && !String(handoverProxyReasonDrafts[item.item_id] || '').trim())" @click="actOnHandoverItem(item, 'accept')">{{ item.review_action_mode === 'proxy' ? '代验收通过' : '验收通过' }}</button></div>
              </div>
            </article>
          </div>
          <button v-if="handoverItemsAccepted.length" type="button" class="handover-closed-toggle" @click="toggleHandoverClosed('items')">{{ handoverClosedVisible('items') ? '收起' : '展开' }}已验收 {{ handoverItemsAccepted.length }} 项</button>
          </div>
        </section>

        <section id="handover-section-risks" class="handover-governance-section" aria-labelledby="handoverRisksTitle">
          <div class="handover-governance-section-head" role="button" tabindex="0" :aria-expanded="handoverSectionIsOpen('risks')" @click="toggleHandoverSection('risks')" @keydown.enter.prevent="toggleHandoverSection('risks')">
            <div><span>风险闭环</span><h4 id="handoverRisksTitle">风险、缓解与关闭证据</h4></div>
            <div class="handover-section-meta">
              <small>离职人或风险责任人登记风险、更新缓解并提交关闭证据；接替人核对后确认关闭。未关闭风险阻断封存。</small>
              <span :class="['handover-section-count', { pending: handoverRisksActive.length }]">{{ handoverRisksActive.length ? `${handoverRisksActive.length} 项未关闭` : '风险已全部关闭' }}</span>
              <span class="handover-section-toggle">{{ handoverSectionIsOpen('risks') ? '收起' : '展开' }}</span>
            </div>
          </div>
          <div v-show="handoverSectionIsOpen('risks')">
          <div v-if="handoverRisksSorted.length" class="handover-risk-list">
            <article v-for="risk in handoverRisksSorted" v-show="risk.status !== 'closed' || handoverClosedVisible('risks')" :key="risk.risk_id" :class="['handover-risk-card', risk.severity]">
              <header><div><span>{{ handoverRiskSeverityMeta[risk.severity] || risk.severity }}风险</span><strong>{{ risk.title }}</strong></div><em :class="['task-status', handoverRiskStatusMeta[risk.status]?.tone]">{{ handoverRiskStatusLabel(risk.status) }}</em></header>
              <p>{{ risk.impact }}</p><small>责任人：{{ handoverMemberName(risk.owner_user_id) }} · 截止 {{ risk.due_at }}</small>
              <div class="handover-evidence"><strong>缓解措施</strong><p>{{ risk.mitigation }}</p><template v-if="risk.close_evidence"><strong>关闭证据</strong><p>{{ risk.close_evidence }}</p></template></div>
              <div v-if="selectedHandover.status !== 'completed' && ['open','mitigating'].includes(risk.status) && canManageHandoverRisk(risk)" class="handover-inline-action risk-action">
                <small class="handover-role-hint">责任人操作 · 更新缓解并提交关闭证据后由接替人确认</small>
                <textarea v-model.trim="handoverRiskActionDrafts[risk.risk_id].mitigation" class="form-input" rows="2" placeholder="更新缓解措施"></textarea>
                <input v-model.trim="handoverRiskActionDrafts[risk.risk_id].close_evidence" class="form-input" placeholder="提交关闭时填写可核验的关闭证据" />
                <div class="handover-inline-actions"><button class="btn-secondary" :disabled="!!handoverActionLoading" @click="actOnHandoverRisk(risk, 'mitigate')">保存缓解措施</button><button class="btn-primary" :disabled="!!handoverActionLoading || !String(handoverRiskActionDrafts[risk.risk_id].close_evidence || '').trim()" @click="actOnHandoverRisk(risk, 'submit_close')">提交关闭验收</button></div>
              </div>
              <div v-if="selectedHandover.status !== 'completed' && ['pending_close','closed'].includes(risk.status) && canReviewHandover()" class="handover-inline-action review">
                <small class="handover-role-hint">接替人操作 · 核对缓解与关闭证据后确认关闭，或填写原因重开</small>
                <input v-model.trim="handoverRiskActionDrafts[risk.risk_id].reason" class="form-input" placeholder="重新打开时填写原因" />
                <div class="handover-inline-actions"><button class="btn-secondary" :disabled="!!handoverActionLoading || !String(handoverRiskActionDrafts[risk.risk_id].reason || '').trim()" @click="actOnHandoverRisk(risk, 'reopen')">重新打开</button><button v-if="risk.status === 'pending_close'" class="btn-primary" :disabled="!!handoverActionLoading" @click="actOnHandoverRisk(risk, 'close')">确认关闭</button></div>
              </div>
            </article>
          </div>
          <p v-else class="handover-record-empty">当前没有已登记风险。无风险也会纳入完成度计算，但仍需核对必交项。</p>
          <button v-if="handoverRisksClosed.length" type="button" class="handover-closed-toggle" @click="toggleHandoverClosed('risks')">{{ handoverClosedVisible('risks') ? '收起' : '展开' }}已关闭 {{ handoverRisksClosed.length }} 项</button>
          <div v-if="selectedHandover.status !== 'completed' && canRegisterHandoverRisk()" class="handover-risk-create-wrap">
            <button type="button" class="btn-secondary" @click="handoverShowRiskForm = !handoverShowRiskForm">{{ handoverShowRiskForm ? '收起登记表单' : '+ 登记风险' }}</button>
            <small>由离职人或风险责任人登记，至少写明等级、影响、责任人、截止时间和缓解措施。</small>
            <div v-show="handoverShowRiskForm" class="handover-risk-create">
              <label>风险标题<input v-model.trim="handoverRiskDraft.title" class="form-input" placeholder="明确描述风险事件" /></label>
              <label>等级<select v-model="handoverRiskDraft.severity" class="form-select"><option value="low">低</option><option value="medium">中</option><option value="high">高</option><option value="blocking">阻断</option></select></label>
              <label>责任人<select v-model="handoverRiskDraft.owner_user_id" class="form-select"><option value="">请选择项目成员</option><option v-for="member in onboardingTargetMembers" :key="member.user_id" :value="member.user_id">{{ member.display_name }}</option></select></label>
              <label>截止时间<input v-model="handoverRiskDraft.due_at" type="date" class="form-input" /></label>
              <label class="wide">影响说明<textarea v-model.trim="handoverRiskDraft.impact" class="form-input" rows="2"></textarea></label>
              <label class="wide">缓解措施<textarea v-model.trim="handoverRiskDraft.mitigation" class="form-input" rows="2"></textarea></label>
              <button class="btn-secondary" :disabled="!!handoverActionLoading" @click="createHandoverRisk">登记风险</button>
            </div>
          </div>
          </div>
        </section>

        <footer class="handover-complete-bar">
          <div><strong>{{ selectedHandover.status === 'completed' ? '交接已经封存' : selectedHandover.completion_gates?.closable ? '全部门槛已满足' : '仍有门槛未满足' }}</strong><small>关闭要求：盘点项全审阅、必交项全验收、风险全关闭、接替确认、学习计划就绪。</small></div>
          <button v-if="selectedHandover.status !== 'completed' && can('handover.manage')" class="btn-primary" :disabled="!!handoverActionLoading || !selectedHandover.completion_gates?.closable" @click="completeHandover">{{ handoverActionLoading === 'complete' ? '正在封存' : '关闭交接并生成快照' }}</button>
        </footer>
      </template>
    </div>
  </div>

  <!-- 岗位模板维护 -->

      <div class="modal-header"><div><span class="feature-head-eyebrow">岗位标准</span><h3 id="onboardingTemplateTitle">维护 {{ onboardingTemplateDraft.name }} 模板</h3></div><button class="btn-icon" :disabled="!!onboardingActionLoading" @click="showOnboardingTemplateModal = false">关闭</button></div>
      <div class="onboarding-template-basics"><label>岗位名称<input v-model.trim="onboardingTemplateDraft.name" class="form-input" /></label><label class="wide onboarding-focus-field">上手重点<textarea v-model.trim="onboardingTemplateDraft.focus" class="form-input" rows="2"></textarea></label></div>
      <div class="onboarding-template-topic-head"><div><strong>必需知识主题</strong><small>权重用于项目知识就绪度和个人任务优先级</small></div><button class="btn-secondary" type="button" @click="addOnboardingTopic">添加主题</button></div>

          <div class="onboarding-template-topic-fields"><label>实践任务<input v-model.trim="topic.practice_task" class="form-input" placeholder="成员需要完成的真实项目任务" /></label><label>完成标准<input v-model.trim="topic.completion_standard" class="form-input" placeholder="可核验的完成结果" /></label><label class="topic-owner-field">主题负责人<select v-model="topic.owner_user_id" class="form-select"><option value="">暂不指定</option><option v-for="member in onboardingTargetMembers" :key="member.user_id" :value="member.user_id">{{ member.display_name }}</option></select></label><label class="topic-assets-field">指定必读资料<select v-model="topic.required_asset_ids" class="form-select" multiple><option v-for="asset in knowledgeAssets" :key="knowledgeAssetId(asset)" :value="knowledgeAssetId(asset)">{{ knowledgeAssetOptionLabel(asset) }}</option></select></label></div>
        </section>
      </div>
      <div class="form-actions"><button class="btn-primary" :disabled="onboardingActionLoading === 'save-template'" @click="saveOnboardingTemplate">{{ onboardingActionLoading === 'save-template' ? '保存中' : '保存岗位模板' }}</button><button class="btn-secondary" :disabled="!!onboardingActionLoading" @click="showOnboardingTemplateModal = false">取消</button></div>
    </div>
  </div>

  <!-- 知识任务提醒策略 -->
  <div v-if="showKnowledgeTaskPolicyModal" class="modal-overlay" @click.self="!knowledgeTaskPolicySaving && (showKnowledgeTaskPolicyModal = false)">
    <div class="modal-content knowledge-task-modal" role="dialog" aria-modal="true" aria-labelledby="knowledgeTaskPolicyTitle">
      <div class="modal-header"><div><span class="feature-head-eyebrow">飞书通知治理</span><h3 id="knowledgeTaskPolicyTitle">知识任务提醒策略</h3></div><button class="btn-icon" :disabled="knowledgeTaskPolicySaving" @click="showKnowledgeTaskPolicyModal = false">关闭</button></div>
      <div v-if="knowledgeTaskPolicyLoading" class="knowledge-task-state">正在读取提醒策略…</div>
      <template v-else>
        <label class="policy-toggle-row"><input v-model="knowledgeTaskNotificationPolicy.enabled" type="checkbox" /><span><strong>启用自动提醒</strong><small>到期任务会合并为飞书摘要，发送失败由处理任务自动重试。</small></span></label>
        <div class="knowledge-task-form-grid">
          <label class="wide">目标飞书群<input v-model.trim="knowledgeTaskNotificationPolicy.target_chat_id" class="form-input" placeholder="输入 Chat ID；留空时使用系统默认群" /><small v-if="knowledgeTaskNotificationPolicy.using_default_chat">当前使用系统默认群</small></label>
          <label class="wide">策略时区<input v-model.trim="knowledgeTaskNotificationPolicy.timezone" class="form-input" placeholder="例如 Asia/Shanghai" /><small>使用 IANA 时区名称计算静默窗口</small></label>
          <label>静默开始<input v-model="knowledgeTaskNotificationPolicy.quiet_start" type="time" class="form-input" /></label>
          <label>静默结束<input v-model="knowledgeTaskNotificationPolicy.quiet_end" type="time" class="form-input" /></label>
          <label>提前提醒<input v-model.number="knowledgeTaskNotificationPolicy.remind_before_hours" type="number" min="1" max="168" class="form-input" /><small>截止前小时数</small></label>
          <label>频率限制<input v-model.number="knowledgeTaskNotificationPolicy.reminder_interval_hours" type="number" min="1" max="168" class="form-input" /><small>同一任务最短间隔</small></label>
          <label>开始升级<input v-model.number="knowledgeTaskNotificationPolicy.escalation_after_hours" type="number" min="1" max="720" class="form-input" /><small>逾期多少小时后升级</small></label>
          <label>升级间隔<input v-model.number="knowledgeTaskNotificationPolicy.escalation_interval_hours" type="number" min="1" max="720" class="form-input" /><small>每隔多少小时升一级</small></label>
        </div>
        <p class="knowledge-task-feedback" role="status">{{ knowledgeTaskPolicyMessage || '策略默认关闭；静默期间只排队，结束后再投递。' }}</p>
        <div class="form-actions"><button class="btn-primary" :disabled="knowledgeTaskPolicySaving" @click="saveKnowledgeTaskNotificationPolicy">{{ knowledgeTaskPolicySaving ? '保存中' : '保存策略' }}</button><button class="btn-secondary" :disabled="knowledgeTaskPolicyScanning || !knowledgeTaskNotificationPolicy.enabled" @click="scanKnowledgeTaskNotifications">{{ knowledgeTaskPolicyScanning ? '扫描中' : '立即扫描' }}</button><button class="btn-secondary" :disabled="knowledgeTaskPolicySaving" @click="showKnowledgeTaskPolicyModal = false">取消</button></div>
      </template>
    </div>
  </div>

  <!-- 新建知识任务 -->
  <div v-if="showKnowledgeTaskModal" class="modal-overlay" @click.self="!knowledgeTaskSaving && (showKnowledgeTaskModal = false)">
    <div class="modal-content knowledge-task-modal" role="dialog" aria-modal="true" aria-labelledby="knowledgeTaskModalTitle">
      <div class="modal-header"><div><span class="feature-head-eyebrow">知识治理协作</span><h3 id="knowledgeTaskModalTitle">新建知识任务</h3></div><button class="btn-icon" :disabled="knowledgeTaskSaving" @click="showKnowledgeTaskModal = false">关闭</button></div>
      <div class="knowledge-task-form-grid">
        <label class="wide">任务标题<input v-model.trim="knowledgeTaskDraft.title" class="form-input" maxlength="160" placeholder="描述要补齐或复审的结果" /></label>

        <label>优先级<select v-model="knowledgeTaskDraft.priority" class="form-select"><option v-for="(label, value) in knowledgeTaskPriorityMeta" :key="value" :value="value">{{ label }}</option></select></label>
        <label v-if="canManageKnowledgeTasks">负责人<select v-model="knowledgeTaskDraft.assignee_user_id" class="form-select"><option value="">暂不分配</option><option v-for="member in projectMembers" :key="member.user_id" :value="member.user_id">{{ member.display_name }} · {{ member.role_label }}</option></select></label>
        <label>截止时间<input v-model="knowledgeTaskDraft.due_at" type="datetime-local" class="form-input" /></label>
        <label class="wide">任务说明<textarea v-model.trim="knowledgeTaskDraft.description" class="form-input" rows="4" placeholder="说明背景、期望结果和验收依据"></textarea></label>
      </div>
      <p v-if="knowledgeTaskMessage" class="knowledge-task-feedback">{{ knowledgeTaskMessage }}</p>
      <div class="form-actions"><button class="btn-primary" :disabled="knowledgeTaskSaving" @click="createKnowledgeTask">{{ knowledgeTaskSaving ? '创建中' : '创建任务' }}</button><button class="btn-secondary" :disabled="knowledgeTaskSaving" @click="showKnowledgeTaskModal = false">取消</button></div>
    </div>
  </div>

  <!-- 取消知识任务确认 -->
  <div v-if="showKnowledgeTaskCancelModal && selectedKnowledgeTask" class="modal-overlay knowledge-confirm-overlay" @click.self="closeKnowledgeTaskCancel">
    <div class="modal-content knowledge-task-cancel-modal" role="alertdialog" aria-modal="true" aria-labelledby="knowledgeTaskCancelTitle" aria-describedby="knowledgeTaskCancelDesc">
      <div class="modal-header">
        <div><span class="danger-eyebrow">保留审计记录</span><h3 id="knowledgeTaskCancelTitle">确认取消此任务？</h3></div>
        <button type="button" class="btn-icon" :disabled="knowledgeTaskActionLoading === 'cancel'" @click="closeKnowledgeTaskCancel">关闭</button>
      </div>
      <div class="knowledge-task-cancel-summary" id="knowledgeTaskCancelDesc">
        <strong>{{ selectedKnowledgeTask.title }}</strong>
        <p>取消后任务会从“未结束任务”中移除，不再提醒负责人；任务及处理记录仍会保留在“已取消”筛选中，便于审计追溯。</p>
      </div>
      <label class="knowledge-task-cancel-reason">
        <span>取消原因 <b aria-hidden="true">*</b></span>
        <textarea v-model.trim="knowledgeTaskCancelReason" class="form-input" rows="3" maxlength="500" placeholder="例如：任务创建有误、已由其他任务覆盖或已不再需要"></textarea>
      </label>
      <p v-if="knowledgeTaskCancelMessage" class="knowledge-task-feedback error" role="alert">{{ knowledgeTaskCancelMessage }}</p>
      <div class="form-actions knowledge-confirm-actions">
        <button type="button" class="btn-danger-sm" :disabled="knowledgeTaskActionLoading === 'cancel' || !knowledgeTaskCancelReason.trim()" @click="confirmKnowledgeTaskCancel">{{ knowledgeTaskActionLoading === 'cancel' ? '取消中…' : '确认取消任务' }}</button>
        <button type="button" class="btn-secondary" :disabled="knowledgeTaskActionLoading === 'cancel'" @click="closeKnowledgeTaskCancel">返回检查</button>
      </div>
    </div>
  </div>

  <!-- 知识资产撤销确认 -->
  <div v-if="knowledgeRevokeConfirmOpen && selectedKnowledgeAsset" class="modal-overlay knowledge-confirm-overlay" @click.self="!knowledgeAssetSaving && (knowledgeRevokeConfirmOpen = false)">
    <div class="modal-content knowledge-revoke-confirm" role="alertdialog" aria-modal="true" aria-labelledby="knowledgeRevokeConfirmTitle" aria-describedby="knowledgeRevokeConfirmDesc">
      <div class="modal-header">
        <div><span class="danger-eyebrow">高影响操作</span><h3 id="knowledgeRevokeConfirmTitle">确认撤销此知识资产？</h3></div>
        <button class="btn-icon" :disabled="knowledgeAssetSaving" @click="knowledgeRevokeConfirmOpen = false">关闭</button>
      </div>
      <div class="knowledge-revoke-impact" id="knowledgeRevokeConfirmDesc">
        <strong>{{ knowledgeAssetTitle(selectedKnowledgeAsset) }}</strong>
        <p>撤销后将立即从以下使用场景移除：</p>
        <ul><li>RAG 检索与知识问答</li><li>知识图谱关系展示</li><li>新人赋能与岗位知识覆盖</li></ul>
        <div><b>仍会保留</b><span>原始文件、历史版本和审计记录，便于追溯与合规检查。</span></div>
        <small>撤销原因：{{ knowledgeRevokeReason }}</small>
      </div>
      <div class="form-actions knowledge-confirm-actions">
        <button class="btn-danger-sm" :disabled="knowledgeAssetSaving" @click="transitionKnowledgeAsset('revoke')">{{ knowledgeAssetSaving ? '撤销中' : '确认撤销' }}</button>
        <button class="btn-secondary" :disabled="knowledgeAssetSaving" @click="knowledgeRevokeConfirmOpen = false">返回检查</button>
      </div>
    </div>
  </div>

  <!-- 文档预览弹窗 -->
  <div v-if="previewData" class="modal-overlay" @click.self="previewData = null">
    <div class="modal-content preview-modal">
      <div class="modal-header">
        <h3>{{ previewFilename }}</h3>
        <button class="btn-icon" @click="previewData = null">关闭</button>
      </div>
      <pre class="preview-content">{{ previewData }}</pre>
    </div>
  </div>
  </template>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="app.js?v=89"></script>
</body>
</html>
