<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 赋能项目知识沉淀系统</title>
<script>
  if (window.location.protocol === 'file:') {
    window.location.replace(`http://127.0.0.1:8000/${window.location.search}${window.location.hash}`);
  }
</script>
  <link rel="stylesheet" href="style.css?v=70" />
<link rel="icon" href="data:," />
</head>
<body>
<div id="app">
  <div v-if="!authReady" class="auth-loading" aria-live="polite">
    <div class="auth-brand-mark">AI</div>
    <p>正在检查登录状态</p>
  </div>

  <main v-else-if="!currentUser" class="auth-page">
    <section class="auth-intro" aria-labelledby="auth-product-title">
      <div class="auth-product-mark">AI</div>
      <p class="auth-eyebrow">企业项目知识工作台</p>
      <h1 id="auth-product-title">让项目经验持续服务团队</h1>
      <p>统一沉淀文档与飞书知识，支持可信问答、知识关系、新人赋能和交接协作。</p>
      <div class="auth-capabilities" aria-label="产品能力">
        <span>来源可追溯</span><span>项目级权限</span><span>过程可审计</span>
      </div>
    </section>

    <section class="auth-panel" aria-labelledby="auth-form-title">
      <template v-if="activationToken && !authConfig.demo_simple_auth">
        <p class="auth-step">首次使用</p>
        <h2 id="auth-form-title">激活项目账号</h2>
        <p class="auth-helper">设置密码后即可进入 AI 赋能项目工作区。</p>
        <form class="auth-form" @submit.prevent="activateAccount">
          <label>新密码<input v-model="activationPassword" type="password" autocomplete="new-password" minlength="12" required placeholder="至少 12 位，包含字母、数字和特殊字符" /></label>
          <label>确认密码<input v-model="activationConfirm" type="password" autocomplete="new-password" minlength="12" required placeholder="再次输入新密码" /></label>
          <p v-if="activationMessage" class="auth-message">{{ activationMessage }}</p>
          <button class="btn-primary auth-submit" type="submit" :disabled="activationLoading">{{ activationLoading ? '激活中' : '激活账号' }}</button>
        </form>
      </template>
      <template v-else>
        <p class="auth-step">成员登录</p>
        <h2 id="auth-form-title">进入项目工作区</h2>
        <p v-if="authConfig.demo_simple_auth" class="auth-helper">演示模式：密码为企业邮箱的 @ 前缀。例如 demo-member@example.com 的密码是 demo-member。</p>
        <p v-else class="auth-helper">使用项目管理员为你创建的企业邮箱账号。</p>
        <form class="auth-form" @submit.prevent="login">
          <label>企业邮箱<input v-model.trim="loginEmail" type="email" autocomplete="username" required placeholder="name@example.com" /></label>
          <label>密码<input v-model="loginPassword" type="password" autocomplete="current-password" required placeholder="请输入密码" /></label>
          <p v-if="loginError" class="auth-message error" role="alert">{{ loginError }}</p>
          <button class="btn-primary auth-submit" type="submit" :disabled="loginLoading">{{ loginLoading ? '登录中' : '登录' }}</button>
        </form>
      </template>
    </section>
  </main>

  <template v-else>
  <div class="app-shell" :class="{ 'mobile-nav-open': mobileNavOpen }">
    <header class="mobile-command-bar">
      <button type="button" class="mobile-nav-trigger" @click="mobileNavOpen = !mobileNavOpen" :aria-expanded="mobileNavOpen" aria-controls="workspace-navigation">菜单</button>
      <strong>AI 赋能项目</strong>
      <button v-if="can('knowledge.upload')" type="button" class="mobile-upload-trigger" @click="openUploadModal()">上传</button>
    </header>
    <button type="button" class="mobile-nav-scrim" @click="mobileNavOpen = false" aria-label="关闭导航"></button>
    <aside id="workspace-navigation" class="workspace-sidebar">
      <div class="workspace-brand">
        <div class="brand-mark">AI</div>
        <div>
          <strong>AI 赋能项目</strong>
          <span>项目工作区</span>
        </div>
      </div>

      <nav class="nav-tabs" aria-label="主要功能">
        <button :class="['nav-tab', { active: tab === 'chat' }]" @click="navigateTo('chat')">
          <span>问答</span><strong>知识问答</strong>
        </button>
        <button v-if="can('feishu.read')" :class="['nav-tab', { active: tab === 'feishu' }]" @click="navigateTo('feishu')">
          <span>采集</span><strong>飞书集成</strong>
        </button>
        <button :class="['nav-tab', { active: tab === 'knowledge' }]" @click="navigateTo('knowledge')">
          <span>文档</span><strong>知识库</strong>
        </button>
        <button :class="['nav-tab', { active: tab === 'graph' }]" @click="navigateTo('graph')">
          <span>关系</span><strong>知识图谱</strong>
        </button>
        <button :class="['nav-tab', { active: tab === 'onboarding' }]" @click="navigateTo('onboarding')">
          <span>成长</span><strong>新人赋能</strong>
        </button>
        <button v-if="can('task.read')" :class="['nav-tab', { active: tab === 'tasks' }]" @click="navigateTo('tasks')">
          <span>协作</span><strong>知识任务</strong>
        </button>
        <button v-if="can('job.read')" :class="['nav-tab', { active: tab === 'jobs' }]" @click="navigateTo('jobs')">
          <span>运行</span><strong>处理任务</strong>
        </button>
        <button :class="['nav-tab', { active: tab === 'resignation' }]" @click="navigateTo('resignation')">
          <span>交接</span><strong>离职交接</strong>
        </button>
        <button v-if="can('settings.manage')" :class="['nav-tab', { active: tab === 'settings' }]" @click="navigateTo('settings')">
          <span>运维</span><strong>系统设置</strong>
        </button>
      </nav>

      <div class="service-card">
        <h3>模型与服务状态</h3>
        <div class="service-row">
          <span>LLM 配置</span>
          <strong :class="llmReady ? 'ok' : 'no'">{{ llmReady ? '已连接' : '未配置' }}</strong>
        </div>
        <div class="service-row">
          <span>RAG 检索</span>
          <strong :class="useRag ? 'ok' : 'no'">{{ useRag ? '已开启' : '已关闭' }}</strong>
        </div>
        <div class="service-row">
          <span>知识存储</span>
          <strong :class="storageReady ? 'ok' : 'no'">{{ storageReady ? '正常' : '需检查' }}</strong>
        </div>
        <div class="service-row">
          <span>飞书机器人</span>
          <strong :class="feishuEventConnected ? 'ok' : 'no'">{{ feishuEventConnected ? '已连接' : feishuConfigured ? '未连接' : '待配置' }}</strong>
        </div>
      </div>
      <div class="sidebar-user">
        <span class="sidebar-user-avatar">{{ userInitial }}</span>
        <span><strong>{{ currentUser.display_name }}</strong><small>{{ currentUser.role_label }}</small></span>
        <button type="button" @click="logout" title="退出登录">退出</button>
      </div>
    </aside>

    <div class="app-workspace">
      <header v-if="tab === 'chat'" class="command-header">
        <div>
          <p class="breadcrumb">AI 赋能项目 / {{ currentTabLabel }}</p>
          <h1>{{ pageTitle }}</h1>
        </div>
        <div class="header-actions">
          <button v-if="can('settings.manage')" class="btn-secondary" @click="navigateTo('settings')">项目设置</button>
          <button v-if="can('knowledge.upload')" class="btn-primary" @click="openUploadModal()">上传文档</button>
        </div>
      </header>

      <main class="main-content">
        <section v-if="tab === 'chat'" class="home-status-rail" aria-label="项目核心指标与服务状态">
          <div class="home-kpi-group">
            <button type="button" class="home-kpi primary" @click="navigateTo('knowledge')" aria-label="查看知识库">
              <span>知识资产</span><strong>{{ displayChunkCount }}</strong><small>已入库文档 {{ dashboardDocs.length }}</small>
            </button>
            <button type="button" class="home-kpi" @click="openFeishuView('content')" aria-label="查看今日飞书消息">
              <span>今日飞书接收</span><strong>{{ feishuSummary.today_received || 0 }}</strong><small>消息事件</small>
            </button>
            <button type="button" class="home-kpi" @click="openFeishuView('content')" aria-label="查看已形成知识">
              <span>已形成知识</span><strong>{{ feishuSummary.published_count || 0 }}</strong><small>可用于 RAG 与图谱</small>
            </button>
            <button type="button" :class="['home-kpi', { attention: feishuSummary.review_required_count }]" @click="openFeishuView('exceptions')" aria-label="查看待处理内容">
              <span>待处理</span><strong>{{ feishuSummary.review_required_count || 0 }}</strong><small>异常或低置信度内容</small>
            </button>
          </div>
          <div class="home-service-group">
            <button type="button" :class="['home-service-status', feishuEventConnected ? 'ok' : 'warn']" @click="openFeishuView('settings')">
              <span class="status-dot"></span><span><strong>飞书{{ feishuEventConnected ? '已连接' : '待连接' }}</strong><small>{{ feishuEventConnected ? '事件通道在线' : '检查事件通道' }}</small></span>
            </button>
            <button type="button" :class="['home-service-status', llmReady ? 'ok' : 'warn']" @click="navigateTo('settings')">
              <span class="status-dot"></span><span><strong>LLM {{ llmReady ? '已配置' : '未配置' }}</strong><small>{{ llmReady ? llmModel : '前往系统设置' }}</small></span>
            </button>
          </div>
        </section>

        <!-- 1. 比赛版首页：交接指挥中心 -->
        <section v-show="tab === 'chat'" class="tab-panel command-center">
          <div class="command-layout">
            <section class="ai-panel">
              <header class="panel-bar">
                <div>
                  <h2>AI 项目知识问答</h2>
                  <p>围绕项目文档、交接资料和团队经验回答问题</p>
                </div>
                <div class="chat-controls">
                  <button v-if="ragEvaluationEnabled && can('knowledge.manage')" class="btn-ghost" @click="openRagEvaluation">质量评测</button>
                  <label class="switch-label">
                    <input type="checkbox" v-model="useRag" />
                    <span>RAG 检索</span>
                  </label>
                  <button class="btn-ghost" @click="clearChat">清空对话</button>
                </div>
              </header>

              <div class="retrieval-flow" :class="{ running: loading }">
                <div v-for="(step, idx) in retrievalSteps" :key="step"
                     :class="['flow-chip', { active: idx <= activeRetrievalStep, current: idx === activeRetrievalStep && loading }]">
                  <span>{{ idx + 1 }}</span>
                  <strong>{{ step }}</strong>
                </div>
              </div>

              <div class="messages command-messages" ref="messagesRef">
                <div v-if="messages.length === 0" class="demo-thread">
                  <div class="message assistant demo">
                    <div class="avatar">AI</div>
                    <div class="bubble">
                      <div class="msg-content">
                        <p>我会基于项目已入库的文档、交接资料和知识图谱回答问题，并在回答下方展示可追溯的来源。</p>
                        <p>可从下方推荐问题开始，或输入当前要解决的项目问题。</p>
                      </div>
                    </div>
                  </div>
                </div>

                <div v-for="(msg, idx) in messages" :key="idx" :class="['message', msg.role]">
                  <div class="avatar">{{ msg.role === 'user' ? '张' : 'AI' }}</div>
                  <div class="bubble">
                    <div v-if="msg.process" :class="['thinking-trace', { 'is-live': msg.process.running, 'is-error': msg.process.failed }]">
                      <button class="thinking-toggle" type="button" @click="toggleThinking(msg)"
                              :aria-expanded="msg.process.expanded">
                        <span class="thinking-indicator" aria-hidden="true"></span>
                        <span class="thinking-copy">
                          <strong>{{ msg.process.running ? '正在分析' : `已处理 ${formatProcessDuration(msg.process.elapsedSeconds)}` }}</strong>
                          <small>{{ msg.process.running ? msg.process.currentDetail : msg.process.summary }}</small>
                        </span>
                        <span class="thinking-caret" aria-hidden="true">{{ msg.process.expanded ? '⌃' : '⌄' }}</span>
                      </button>
                      <div v-show="msg.process.expanded" class="thinking-steps">
                        <article v-for="(entry, entryIdx) in msg.process.entries" :key="entry.id"
                                 :class="['thinking-step', entry.status]">
                          <span class="step-marker">{{ entry.status === 'done' ? '✓' : entryIdx + 1 }}</span>
                          <div class="thinking-entry-copy">
                            <div>
                              <strong>{{ entry.title }}</strong>
                              <em>{{ processStatusLabel(entry.status) }}</em>
                            </div>
                            <p>{{ entry.detail }}</p>
                            <div v-if="entry.evidence && entry.evidence.length" class="thinking-evidence">
                              <span v-for="item in entry.evidence" :key="item">{{ item }}</span>
                            </div>
                          </div>
                        </article>
                      </div>
                    </div>
                    <div class="sources" v-if="!msg.pending && msg.sources && msg.sources.length">
                      <div class="sources-title">参考来源</div>
                      <div v-for="(s, si) in msg.sources" :key="si" class="source-item">
                        <span class="source-badge">{{ s.source }}</span>
                        <span class="source-text">{{ s.content }}</span>
                      </div>
                    </div>
                    <div v-if="!msg.pending || msg.content" class="msg-content" v-html="renderMarkdown(msg.content)"></div>
                    <div v-if="msg.role === 'assistant' && !msg.pending && msg.answerId" class="answer-feedback">
                      <div v-if="!msg.feedback" class="answer-feedback-actions">
                        <span>这个回答有帮助吗？</span>
                        <button type="button" :disabled="msg.feedbackSaving" @click="submitAnswerFeedback(msg, true)">有帮助</button>
                        <button type="button" :disabled="msg.feedbackSaving" @click="msg.feedbackOpen = !msg.feedbackOpen">无帮助</button>
                        <button v-if="msg.noAnswer" type="button" class="feedback-task-action"
                                :disabled="msg.feedbackSaving"
                                @click="msg.feedbackReason = 'incomplete'; submitAnswerFeedback(msg, false)">创建知识补充任务</button>
                      </div>
                      <div v-if="msg.feedbackOpen && !msg.feedback" class="answer-feedback-form">
                        <select v-model="msg.feedbackReason" aria-label="无帮助原因">
                          <option value="" disabled>选择原因</option>
                          <option value="citation_error">引用错误</option>
                          <option value="knowledge_outdated">知识过期</option>
                          <option value="incomplete">答案不完整</option>
                          <option value="permission_blocked">无权限误拦截</option>
                          <option value="other">其他问题</option>
                        </select>
                        <input v-model="msg.feedbackNote" maxlength="1000" placeholder="补充说明（可选）" />
                        <button type="button" :disabled="msg.feedbackSaving || !msg.feedbackReason" @click="submitAnswerFeedback(msg, false)">
                          {{ msg.feedbackSaving ? '提交中' : '提交并创建改进任务' }}
                        </button>
                      </div>
                      <p v-if="msg.feedbackMessage" :class="['answer-feedback-message', { error: !msg.feedback }]">
                        {{ msg.feedbackMessage }}
                        <button v-if="msg.feedbackTaskId" type="button" @click="navigateTo('tasks')">查看任务</button>
                      </p>
                    </div>
                  </div>
                </div>
              </div>

              <div class="suggestion-row">
                <button v-for="question in starterQuestions" :key="question" @click="input = question">{{ question }}</button>
              </div>

              <footer class="input-area command-input">
                <textarea v-model="input" @keydown.enter.prevent="sendMessage"
                          placeholder="输入问题，Enter 发送，Shift + Enter 换行" rows="1"></textarea>
                <select v-model="chatMode" aria-label="问答模式">
                  <option value="smart">智能模式</option>
                  <option value="direct">直接问答</option>
                </select>
                <button @click="sendMessage" :disabled="!input.trim() || loading">发送</button>
              </footer>
            </section>

            <div class="right-command-stack">
              <aside class="home-feishu-dashboard">
                <header class="home-feishu-head">
                  <div>
                    <div class="home-feishu-title-row">
                      <h2>飞书知识指挥台</h2>
                      <span :class="['live-indicator', feishuEventConnected ? 'ok' : 'warn']"><i></i>{{ feishuEventConnected ? '实时同步中' : '通道待连接' }}</span>
                    </div>
                    <p>从项目沟通到可复用知识，自动归档、聚合和入库</p>
                  </div>
                  <button class="text-action" @click="openFeishuView('overview')">进入工作台</button>
                </header>

                <div class="home-feishu-metrics">
                  <button @click="openFeishuView('sources')"><strong>{{ feishuSummary.group_count || 0 }}</strong><span>采集源</span><small>已授权运行</small></button>
                  <button @click="openFeishuView('content')"><strong>{{ feishuSummary.message_count || 0 }}</strong><span>消息归档</span><small>今日 +{{ feishuSummary.today_received || 0 }}</small></button>
                  <button @click="openFeishuView('content')"><strong>{{ feishuSummary.published_count || 0 }}</strong><span>已形成知识</span><small>今日完成 {{ feishuSummary.today_completed_count || 0 }}</small></button>
                  <button :class="{ attention: feishuSummary.review_required_count }" @click="openFeishuView('exceptions')"><strong>{{ feishuSummary.review_required_count || 0 }}</strong><span>待处理</span><small>{{ feishuSummary.review_required_count ? '需要人工确认' : '无需人工处理' }}</small></button>
                </div>

                <ol class="home-feishu-pipeline" aria-label="飞书知识处理流程">
                  <li v-for="(stage, index) in feishuPipelineStages" :key="stage.key">
                    <span>{{ index + 1 }}</span>
                    <div><strong>{{ stage.label }}</strong><small>{{ stage.count }} 项</small></div>
                    <i v-if="index < feishuPipelineStages.length - 1">›</i>
                  </li>
                </ol>

                <div class="home-feishu-detail-grid">
                  <section class="home-activity-panel">
                    <div class="mini-panel-head"><h3>实时动态</h3><button @click="openFeishuView('content')">查看全部</button></div>
                    <div class="home-activity-list">
                      <article v-for="activity in feishuRecentActivity.slice(0, 4)" :key="activity.id">
                        <span :class="['activity-mark', activity.tone]"></span>
                        <div><strong>{{ activity.title }}</strong><small>{{ activity.source }} · {{ activity.type }}</small><p>{{ activity.detail }}</p></div>
                        <time>{{ activity.time }}</time>
                      </article>
                      <p v-if="!feishuRecentActivity.length" class="insight-empty">暂无飞书处理动态。</p>
                    </div>
                  </section>

                  <section class="home-conversion-panel">
                    <div class="mini-panel-head"><h3>今日转化</h3><button @click="openFeishuView('overview')">查看明细</button></div>
                    <div class="home-conversion-summary">
                      <strong>{{ feishuTodayConversion.conversionRate }}%</strong>
                      <span>消息转知识</span>
                      <small>今日完成发布 {{ feishuTodayConversion.completedCount }} 项</small>
                    </div>
                    <div class="home-conversion-rows">
                      <div v-for="stage in feishuTodayConversion.stages" :key="stage.key">
                        <span>{{ stage.label }}</span><strong>{{ stage.count }}</strong><i><b :style="{ width: stage.width + '%' }"></b></i>
                      </div>
                    </div>
                  </section>
                </div>

                <footer class="home-feishu-actions">
                  <button class="btn-primary" @click="openFeishuView('content')">进入内容中心</button>
                  <button class="btn-secondary" @click="openFeishuView('sources')">同步群消息</button>
                  <button class="btn-secondary" @click="pushDaily" :disabled="feishuLoading">{{ feishuLoading ? '推送中' : '推送知识卡片' }}</button>
                </footer>
              </aside>

              <div class="insight-grid home-support-grid">
                <section class="insight-card recent-docs">
                  <div class="card-head">
                    <h3>最近上传文档</h3>
                    <button @click="tab = 'knowledge'">上传</button>
                  </div>
                  <div v-for="doc in dashboardDocs.slice(0, 3)" :key="doc.name" class="doc-mini-row">
                    <span>{{ doc.ext }}</span>
                    <div>
                      <strong>{{ doc.name }}</strong>
                      <small>{{ doc.status }} · {{ doc.chunks }} 块</small>
                    </div>
                    <em :style="{ width: doc.progress + '%' }"></em>
                  </div>
                  <p v-if="!dashboardDocs.length" class="insight-empty">暂无已入库文档。</p>
                  <button class="link-button" @click="tab = 'knowledge'">查看全部文档</button>
                </section>

                <section class="insight-card graph-preview">
                  <div class="card-head">
                    <h3>知识图谱关系预览</h3>
                    <button @click="tab = 'graph'">进入图谱</button>
                  </div>
                  <div v-if="graphPreviewNodes.length" class="graph-map">
                    <div v-for="(node, index) in graphPreviewNodes" :key="node.id" :class="['graph-node', index === 0 ? 'center' : `n${index}`]">{{ node.topic || node.label }}</div>
                    <div v-for="(_, index) in graphPreviewEdges" :key="index" :class="['graph-edge', `e${index + 1}`]"></div>
                  </div>
                  <p v-else class="insight-empty">暂无图谱节点，上传文档后可构建关系网络。</p>
                  <div class="graph-stats">
                    <span>节点 <strong>{{ displayGraphNodes }}</strong></span>
                    <span>关系 <strong>{{ displayGraphEdges }}</strong></span>
                    <span>来源文档 <strong>{{ displayCitationCount }}</strong></span>
                  </div>
                </section>

                <section :class="['insight-card', 'home-handover-card', { attention: handoverRisks.length }]">
                  <div class="card-head">
                    <h3>离职交接状态</h3>
                    <button @click="tab = 'resignation'">查看流程</button>
                  </div>
                  <div class="home-handover-summary">
                    <span :class="handoverRisks.length ? 'warn' : 'idle'">{{ handoverRecords.length }}</span>
                    <div>
                      <strong>{{ activeHandoverRecord ? `${activeHandoverRecord.name}的交接进行中` : '暂无进行中交接' }}</strong>
                      <p>{{ handoverRisks.length ? `${handoverRisks.length} 项风险需要补充` : '当前无风险，仅在发生交接时进入处理' }}</p>
                    </div>
                  </div>
                </section>
              </div>
            </div>
          </div>

          <section class="ingestion-strip" :class="{ active: kbUploading }">
            <header>
              <h3>{{ lastIngestion ? `当前入库：${lastIngestion.filename}` : '文档入库流程' }}</h3>

            </header>
            <div class="ingestion-steps">
              <div v-for="(step, idx) in ingestionSteps" :key="step.title"
